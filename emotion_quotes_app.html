<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialQuotes = {"기쁘고 행복함": [{"text": "행복은 네가 경험하는 것이 아니라, 네가 기억하는 것이다.", "author": "오스카 레반트"}, {"text": "웃음 없는 하루는 낭비한 하루다.", "author": "찰리 채플린"}, {"text": "행복의 문 하나가 닫히면 다른 문이 열린다.", "author": "헬렌 켈러"}, {"text": "우리가 가진 것을 기뻐할 때 비로소 진정한 행복이 시작된다.", "author": "에피쿠로스"}, {"text": "행복은 도달하는 목적지가 아니라, 여행하는 방법이다.", "author": "마가렛 리 룬벡"}, {"text": "지금 이 순간 행복하기로 선택해봐.", "author": "작자 미상"}, {"text": "네가 웃을 때 세상도 함께 웃는다.", "author": "작자 미상"}, {"text": "행복한 마음은 아름다운 얼굴을 만든다.", "author": "작자 미상"}, {"text": "가장 행복한 사람은 자신을 가장 많이 아는 사람이다.", "author": "소크라테스"}, {"text": "행복은 향수와 같아서, 자신에게 먼저 뿌리지 않고는 남에게 향기를 줄 수 없다.", "author": "랄프 왈도 에머슨"}, {"text": "작은 기쁨이 모여 큰 행복을 이룬다.", "author": "작자 미상"}, {"text": "행복은 긍정적인 생각에서 피어나는 꽃이다.", "author": "작자 미상"}, {"text": "네 안의 빛을 발산할 때 가장 행복하다.", "author": "작자 미상"}, {"text": "스스로를 사랑하는 것이 평생의 로맨스의 시작이다.", "author": "오스카 와일드"}, {"text": "기쁨은 모든 아름다움의 기본이다.", "author": "작자 미상"}, {"text": "오늘 하루, 너의 미소가 누군가의 희망이 될 수 있어.", "author": "작자 미상"}, {"text": "행복은 마법이 아니라, 매일의 선택이다.", "author": "작자 미상"}, {"text": "마음이 즐거우면 모든 것이 빛나 보인다.", "author": "작자 미상"}, {"text": "가장 아름다운 미소는 어려움을 겪고 난 후의 미소다.", "author": "작자 미상"}, {"text": "네가 행복할 때, 네 주변의 세상도 더 아름다워져.", "author": "작자 미상"}], "슬프고 우울함": [{"text": "눈물을 흘려도 괜찮아. 비 온 뒤에 땅이 더 단단해지니까.", "author": "작자 미상"}, {"text": "모든 슬픔은 그것을 이야기로 만들거나 그것들에 대해 이야기할 수 있다면 견딜 수 있다.", "author": "이사크 디네센"}, {"text": "가장 깊은 밤이 지나야 가장 밝은 아침이 온다.", "author": "작자 미상"}, {"text": "힘들면 잠시 쉬어가도 돼. 너의 속도대로 가자.", "author": "작자 미상"}, {"text": "슬픔은 영원히 지속되지 않는다. 구름 뒤에는 항상 태양이 숨어 있다.", "author": "작자 미상"}, {"text": "오늘 하루 종일 아무것도 안 했어도, 숨 쉬고 살아낸 것만으로도 충분해.", "author": "작자 미상"}, {"text": "네가 느끼는 감정은 모두 타당해. 억누르지 않아도 돼.", "author": "작자 미상"}, {"text": "울고 싶을 땐 소리 내어 울어. 마음의 먼지가 씻겨 내려갈 거야.", "author": "작자 미상"}, {"text": "지금의 아픔이 훗날 너를 더 깊고 다정한 사람으로 만들어줄 거야.", "author": "작자 미상"}, {"text": "겨울이 오면 봄이 멀지 않으리.", "author": "퍼시 비시 셸리"}, {"text": "혼자라고 느껴질 때, 내가 너의 랜선 친구가 되어줄게.", "author": "작자 미상"}, {"text": "아무것도 나아지지 않을 것 같아도, 시간은 조용히 상처를 치료해.", "author": "작자 미상"}, {"text": "너는 네 생각보다 훨씬 더 강하고 아름다운 사람이야.", "author": "작자 미상"}, {"text": "슬픔을 느끼는 건 네가 그만큼 따뜻한 마음을 가졌다는 증거야.", "author": "작자 미상"}, {"text": "오늘 하루도 버텨내느라 정말 고생 많았어.", "author": "작자 미상"}, {"text": "모든 것이 무너진 것 같아도, 다시 시작할 수 있는 기회는 항상 있어.", "author": "작자 미상"}, {"text": "가끔은 괜찮지 않아도 괜찮아.", "author": "작자 미상"}, {"text": "어두운 터널의 끝에는 반드시 빛이 기다리고 있어.", "author": "작자 미상"}, {"text": "너의 가치는 너의 우울함으로 깎이지 않아. 넌 여전히 빛나.", "author": "작자 미상"}, {"text": "포기하지만 않으면, 언젠가 지금을 웃으며 이야기할 날이 올 거야.", "author": "작자 미상"}], "즐겁고 기대됨": [{"text": "미래는 꿈의 아름다움을 믿는 자들의 것이다.", "author": "엘리너 루스벨트"}, {"text": "무언가를 시작하기에 완벽한 타이밍은 바로 지금이야.", "author": "작자 미상"}, {"text": "가슴 뛰는 일을 한다는 건 살아있다는 가장 확실한 증거야.", "author": "작자 미상"}, {"text": "기대감이 주는 설렘은 그 자체로 이미 작은 성공이다.", "author": "작자 미상"}, {"text": "네가 상상할 수 있다면, 해낼 수도 있다.", "author": "월트 디즈니"}, {"text": "멋진 일은 언제나 예상치 못한 순간에 찾아와.", "author": "작자 미상"}, {"text": "오늘 하루 어떤 즐거운 일이 벌어질지 기대하며 문을 나서봐.", "author": "작자 미상"}, {"text": "너의 에너지가 새로운 기회를 끌어당기고 있어.", "author": "작자 미상"}, {"text": "즐거운 마음으로 하는 일은 결코 실패하지 않는다.", "author": "작자 미상"}, {"text": "한 번 해보는 거야! 그게 다야.", "author": "작자 미상"}, {"text": "시작하는 모든 존재는 늘 아프고 아름답다.", "author": "작자 미상"}, {"text": "무한한 가능성이 너를 향해 활짝 열려 있어.", "author": "작자 미상"}, {"text": "도전을 즐기는 너의 모습이 가장 멋져.", "author": "작자 미상"}, {"text": "두려움을 설렘으로 바꿀 수 있다면 넌 이미 성장한 거야.", "author": "작자 미상"}, {"text": "새로운 시작은 언제나 짜릿해. 맘껏 즐겨!", "author": "작자 미상"}, {"text": "너의 기대를 현실로 만들 마법의 주문: '할 수 있다!'", "author": "작자 미상"}, {"text": "별을 향해 쏴라. 빗나가더라도 달에 떨어질 것이다.", "author": "레스 브라운"}, {"text": "매일 아침 눈을 뜰 때마다 새로운 모험이 시작돼.", "author": "작자 미상"}, {"text": "가장 신나는 일은 아직 일어나지 않았어.", "author": "작자 미상"}, {"text": "네 앞길에 펼쳐질 멋진 풍경들을 기대해봐.", "author": "작자 미상"}], "짜증나고 분노폭발": [{"text": "화를 내면 분노의 독을 스스로 마시는 것과 같다.", "author": "붓다"}, {"text": "짜증이 날 땐 심호흡을 크게 3번 해봐. 조금은 가라앉을 거야.", "author": "작자 미상"}, {"text": "네 감정의 주도권은 너에게 있어. 다른 사람에게 휘둘리지 마.", "author": "작자 미상"}, {"text": "분노는 어리석음에서 시작해 후회로 끝난다.", "author": "피타고라스"}, {"text": "지금 화가 나는 건 당연해. 하지만 널 망치게 두지는 마.", "author": "작자 미상"}, {"text": "때로는 침묵이 가장 통쾌한 복수가 될 수 있어.", "author": "작자 미상"}, {"text": "감정은 파도와 같아. 높이 솟구쳤다가도 이내 잔잔해질 거야.", "author": "작자 미상"}, {"text": "잠시 그 자리를 피해 시원한 물 한 잔 마시고 와.", "author": "작자 미상"}, {"text": "스트레스 받는 일에 너의 소중한 에너지를 다 쓰지 마.", "author": "작자 미상"}, {"text": "화가 날 때 하는 말은 네가 평생 후회할 최고의 연설이다.", "author": "앰브로스 비어스"}, {"text": "네가 화내는 대상이 그럴만한 가치가 있는지 생각해봐.", "author": "작자 미상"}, {"text": "나쁜 감정에 오래 머물기엔 너의 시간이 너무 아까워.", "author": "작자 미상"}, {"text": "분노 뒤에 숨은 너의 상처를 먼저 토닥여줘.", "author": "작자 미상"}, {"text": "화를 참는 게 아니라 잘 흘려보내는 연습이 필요해.", "author": "작자 미상"}, {"text": "어제 화냈던 일을 오늘 생각해보면 별거 아닐 때가 많지.", "author": "작자 미상"}, {"text": "폭발할 것 같다면 베개에 대고 크게 소리라도 질러봐.", "author": "작자 미상"}, {"text": "화를 내는 것은 남의 잘못을 자신에게 벌주는 것이다.", "author": "알렉산더 포프"}, {"text": "짜증나는 일은 시원한 아이스크림과 함께 꿀꺽 삼켜버려.", "author": "작자 미상"}, {"text": "모든 것을 통제할 순 없어. 놓아주는 것도 용기야.", "author": "작자 미상"}, {"text": "이 화도 결국은 지나갈 바람이야.", "author": "작자 미상"}], "지치고 번아웃": [{"text": "충전되지 않은 배터리로는 어떤 기계도 돌아갈 수 없어. 널 먼저 충전해.", "author": "작자 미상"}, {"text": "휴식은 게으름이 아니라 다음 스텝을 위한 준비야.", "author": "작자 미상"}, {"text": "아무것도 하지 않을 권리가 너에게도 있어.", "author": "작자 미상"}, {"text": "지쳤다는 건 네가 그동안 온 힘을 다했다는 멋진 증거야.", "author": "작자 미상"}, {"text": "너무 무거운 짐은 잠시 바닥에 내려놓고 어깨를 펴.", "author": "작자 미상"}, {"text": "때로는 멈춰 서서 지나온 길을 돌아보는 시간도 필요해.", "author": "작자 미상"}, {"text": "완벽하지 않아도 괜찮아. 최선을 다한 걸로 충분해.", "author": "작자 미상"}, {"text": "스스로에게 '수고했어'라고 말해줄 타이밍이야.", "author": "작자 미상"}, {"text": "달리기만 하면 풍경을 볼 수 없어. 천천히 걸어봐.", "author": "작자 미상"}, {"text": "번아웃은 너의 몸과 마음이 보내는 '나를 좀 돌봐줘'라는 신호야.", "author": "작자 미상"}, {"text": "조급해하지 마. 너의 속도대로 가도 목적지에 닿을 수 있어.", "author": "작자 미상"}, {"text": "오늘 하루쯤은 세상 스위치를 끄고 푹 자는 건 어떨까?", "author": "작자 미상"}, {"text": "다른 사람의 기대보다 너의 평안이 훨씬 더 중요해.", "author": "작자 미상"}, {"text": "소진된 나를 위해 맛있는 음식으로 보상해주자.", "author": "작자 미상"}, {"text": "아무리 바빠도 하늘을 올려다볼 1분의 여유는 가지길.", "author": "작자 미상"}, {"text": "잘 쉬는 사람이 일도 잘하는 법이야.", "author": "작자 미상"}, {"text": "지친 마음에 따뜻한 위로의 이불을 덮어줄게.", "author": "작자 미상"}, {"text": "내려놓음으로써 오히려 더 많은 것을 얻을 때도 있어.", "author": "작자 미상"}, {"text": "숨이 찰 땐 무리하지 말고 잠시 주저앉아도 돼.", "author": "작자 미상"}, {"text": "지금 넌 충분히 잘하고 있어. 의심하지 마.", "author": "작자 미상"}], "불안하고 스트레스": [{"text": "걱정의 90%는 일어나지 않을 일에 대한 것이다.", "author": "어니 젤린스키"}, {"text": "심호흡을 크게 해봐. 지금 이 순간, 너는 안전해.", "author": "작자 미상"}, {"text": "불안은 미래를 예측하려는 마음의 버릇일 뿐이야.", "author": "작자 미상"}, {"text": "모든 것을 완벽하게 해내야 한다는 강박에서 벗어나도 돼.", "author": "작자 미상"}, {"text": "한 번에 하나씩만 생각해. 지금 당장 할 수 있는 것부터.", "author": "작자 미상"}, {"text": "스트레스는 네가 그 일을 잘 해내고 싶어 한다는 열정의 이면이야.", "author": "작자 미상"}, {"text": "눈을 감고 네가 가장 편안했던 장소를 상상해봐.", "author": "작자 미상"}, {"text": "오늘 걱정은 내일로 미뤄둬도 세상은 무너지지 않아.", "author": "작자 미상"}, {"text": "어려움 한가운데 그곳에 기회가 있다.", "author": "알베르트 아인슈타인"}, {"text": "불안한 감정에 휩쓸리지 말고, 제3자가 되어 바라봐.", "author": "작자 미상"}, {"text": "어두운 생각의 꼬리를 자르고 긍정의 스위치를 켜봐.", "author": "작자 미상"}, {"text": "네가 통제할 수 없는 일은 과감히 우주에 맡겨버려.", "author": "작자 미상"}, {"text": "지금까지 겪은 수많은 고비도 넌 결국 다 넘겼잖아.", "author": "작자 미상"}, {"text": "두려움은 환상이다. 용기 있게 맞서면 신기루처럼 사라져.", "author": "작자 미상"}, {"text": "마음속 폭풍우도 시간이 지나면 반드시 잦아들 거야.", "author": "작자 미상"}, {"text": "불안할 땐 좋아하는 노래를 크게 틀고 따라 불러봐.", "author": "작자 미상"}, {"text": "너는 이 시련을 이겨낼 충분한 힘을 가지고 태어났어.", "author": "작자 미상"}, {"text": "다른 사람과 비교하지 마. 넌 너만의 고유한 타임라인이 있어.", "author": "작자 미상"}, {"text": "머릿속이 복잡할 땐 종이에 생각들을 다 적어내려가 봐.", "author": "작자 미상"}, {"text": "괜찮아, 다 잘 될 거야. 내가 널 항상 응원하고 있어.", "author": "작자 미상"}]};
        const emotions = Object.keys(initialQuotes);

        const App = () => {
            const [quotes, setQuotes] = useState(initialQuotes);
            const [selectedEmotion, setSelectedEmotion] = useState(null);
            const [currentQuote, setCurrentQuote] = useState(null);
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isManageModalOpen, setIsManageModalOpen] = useState(false);

            const [addEmotion, setAddEmotion] = useState(emotions[0]);
            const [addText, setAddText] = useState("");
            const [addAuthor, setAddAuthor] = useState("");

            const handleEmotionClick = (emotion) => {
                setSelectedEmotion(emotion);
                showRandomQuote(emotion, quotes);
            };

            const showRandomQuote = (emotion, currentQuotes) => {
                const emotionQuotes = currentQuotes[emotion];
                if (emotionQuotes && emotionQuotes.length > 0) {
                    const randomIndex = Math.floor(Math.random() * emotionQuotes.length);
                    setCurrentQuote(emotionQuotes[randomIndex]);
                } else {
                    setCurrentQuote({ text: "등록된 명언이 없습니다.", author: "" });
                }
            };

            const handleNextQuote = () => {
                if (selectedEmotion) {
                    showRandomQuote(selectedEmotion, quotes);
                }
            };

            const handleAddQuote = (e) => {
                e.preventDefault();
                if (!addText.trim()) {
                    alert("명언 내용을 입력해주세요.");
                    return;
                }
                const newQuote = { text: addText, author: addAuthor || "작자 미상" };
                const updatedQuotes = { ...quotes, [addEmotion]: [newQuote, ...quotes[addEmotion]] };
                setQuotes(updatedQuotes);
                setAddText("");
                setAddAuthor("");
                setIsAddModalOpen(false);
                alert("명언이 추가되었습니다!");
                
                if (selectedEmotion === addEmotion) {
                    showRandomQuote(addEmotion, updatedQuotes);
                }
            };

            const handleDeleteQuote = (emotion, index) => {
                if (confirm("정말로 이 명언을 삭제하시겠습니까?")) {
                    const updatedEmotionQuotes = [...quotes[emotion]];
                    updatedEmotionQuotes.splice(index, 1);
                    const updatedQuotes = { ...quotes, [emotion]: updatedEmotionQuotes };
                    setQuotes(updatedQuotes);
                    
                    if (selectedEmotion === emotion) {
                        showRandomQuote(emotion, updatedQuotes);
                    }
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center p-4 pt-8 md:pt-16 pb-10">
                    <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col relative">
                        <div className="bg-indigo-600 p-6 text-center shadow-inner">
                            <h1 className="text-2xl font-bold text-white tracking-tight">마음 챙김 명언</h1>
                            <p className="text-indigo-200 mt-2 text-sm font-medium">지금 당신의 기분은 어떤가요?</p>
                        </div>
                        
                        <div className="p-6 flex-1 flex flex-col">
                            {!selectedEmotion ? (
                                <div className="grid grid-cols-2 gap-3 mt-2">
                                    {emotions.map(emotion => (
                                        <button
                                            key={emotion}
                                            onClick={() => handleEmotionClick(emotion)}
                                            className="py-4 px-2 rounded-2xl bg-indigo-50 text-indigo-700 font-bold text-[15px] hover:bg-indigo-100 transition-colors shadow-sm active:scale-95 flex items-center justify-center text-center leading-tight"
                                        >
                                            {emotion}
                                        </button>
                                    ))}
                                </div>
                            ) : (
                                <div className="flex flex-col items-center animate-fade-in flex-1">
                                    <div className="inline-block px-4 py-1.5 bg-indigo-100 text-indigo-800 rounded-full text-sm font-bold mb-6 shadow-sm">
                                        {selectedEmotion}
                                    </div>
                                    
                                    <div className="text-center flex-1 flex flex-col justify-center mb-8 w-full px-2 relative min-h-[160px]">
                                        <svg className="absolute top-0 left-0 w-10 h-10 text-indigo-100 -translate-x-2 -translate-y-4 z-0" fill="currentColor" viewBox="0 0 24 24"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/></svg>
                                        <p className="text-xl md:text-2xl font-semibold text-gray-800 leading-relaxed z-10 break-keep">
                                            "{currentQuote?.text}"
                                        </p>
                                        <p className="text-gray-500 mt-5 font-medium z-10">- {currentQuote?.author} -</p>
                                    </div>
                                    
                                    <div className="flex flex-col w-full gap-3 mt-auto">
                                        <button 
                                            onClick={handleNextQuote}
                                            className="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold text-lg hover:bg-indigo-700 shadow-md transition-colors active:scale-95"
                                        >
                                            다른 명언 보기
                                        </button>
                                        <button 
                                            onClick={() => setSelectedEmotion(null)}
                                            className="w-full py-3 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition-colors active:scale-95"
                                        >
                                            감정 다시 선택하기
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        <div className="bg-gray-50 p-4 border-t border-gray-100 flex justify-between items-center mt-auto">
                            <button 
                                onClick={() => setIsAddModalOpen(true)}
                                className="text-sm font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 p-2 rounded-lg hover:bg-indigo-50 transition-colors"
                            >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                직접 등록하기
                            </button>
                            <button 
                                onClick={() => setIsManageModalOpen(true)}
                                className="text-sm font-bold text-gray-500 hover:text-gray-800 flex items-center gap-1 p-2 rounded-lg hover:bg-gray-100 transition-colors"
                            >
                                ⚙️ 명언 관리
                            </button>
                        </div>
                    </div>

                    {/* Add Modal */}
                    {isAddModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl">
                                <h2 className="text-xl font-bold text-gray-800 mb-5">새로운 명언 등록</h2>
                                <form onSubmit={handleAddQuote} className="flex flex-col gap-4">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1.5">감정 카테고리</label>
                                        <select 
                                            value={addEmotion}
                                            onChange={(e) => setAddEmotion(e.target.value)}
                                            className="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-indigo-500 focus:ring-0 outline-none font-medium bg-gray-50 transition-colors"
                                        >
                                            {emotions.map(emp => (
                                                <option key={emp} value={emp}>{emp}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1.5">명언 내용</label>
                                        <textarea 
                                            value={addText}
                                            onChange={(e) => setAddText(e.target.value)}
                                            placeholder="위로나 격려가 되는 문장을 적어주세요."
                                            className="w-full border-2 border-gray-200 rounded-xl p-3 h-28 resize-none focus:border-indigo-500 focus:ring-0 outline-none font-medium bg-gray-50 transition-colors"
                                        ></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1.5">발언자 <span className="text-gray-400 font-normal">(선택)</span></label>
                                        <input 
                                            type="text" 
                                            value={addAuthor}
                                            onChange={(e) => setAddAuthor(e.target.value)}
                                            placeholder="작자 미상"
                                            className="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-indigo-500 focus:ring-0 outline-none font-medium bg-gray-50 transition-colors"
                                        />
                                    </div>
                                    <div className="flex gap-3 mt-4">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsAddModalOpen(false)}
                                            className="flex-1 py-3.5 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition-colors"
                                        >
                                            취소
                                        </button>
                                        <button 
                                            type="submit"
                                            className="flex-1 py-3.5 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-colors"
                                        >
                                            등록하기
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Manage Modal */}
                    {isManageModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4 z-50 animate-fade-in">
                            <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md p-6 shadow-2xl flex flex-col h-[85vh] sm:h-[80vh]">
                                <div className="flex justify-between items-center mb-5 pb-4 border-b border-gray-100">
                                    <h2 className="text-xl font-bold text-gray-800">명언 관리</h2>
                                    <button onClick={() => setIsManageModalOpen(false)} className="text-gray-400 hover:text-gray-700 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center font-bold text-lg transition-colors">&times;</button>
                                </div>
                                <div className="flex-1 overflow-y-auto pr-2 space-y-8 pb-4">
                                    {emotions.map(emotion => (
                                        <div key={emotion}>
                                            <h3 className="font-bold text-indigo-600 mb-3 flex items-center gap-2">
                                                {emotion}
                                                <span className="bg-indigo-100 text-indigo-700 text-xs py-0.5 px-2 rounded-full">{quotes[emotion].length}</span>
                                            </h3>
                                            <ul className="space-y-3">
                                                {quotes[emotion].map((q, idx) => (
                                                    <li key={idx} className="bg-white p-4 rounded-2xl flex justify-between items-start gap-3 shadow-sm border border-gray-100">
                                                        <div className="text-sm flex-1">
                                                            <p className="text-gray-800 font-medium leading-snug">"{q.text}"</p>
                                                            <p className="text-gray-500 text-xs mt-2 font-semibold">- {q.author}</p>
                                                        </div>
                                                        <button 
                                                            onClick={() => handleDeleteQuote(emotion, idx)}
                                                            className="text-red-500 text-xs font-bold whitespace-nowrap bg-red-50 px-3 py-2 rounded-lg hover:bg-red-100 transition-colors"
                                                        >
                                                            삭제
                                                        </button>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <style dangerouslySetInnerHTML={{__html: `
                        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
                        .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
                    `}} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
