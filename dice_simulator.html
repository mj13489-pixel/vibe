<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 주사위 확률 실험실</title>
<style>
:root{--stg:linear-gradient(160deg,#c3d3ea,#a9bddd);--bg:#f4f5f9;--card:#fff;--tx:#1d2233;--mut:#6b7186;--bd:#e1e4ee;--ac:#4f46e5;--ac2:#e11d48;--bar:#6366f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#eceef6;--mut:#9aa0b8;--bd:#2c3042;--ac:#818cf8;--ac2:#fb7185;--bar:#818cf8;--stg:linear-gradient(160deg,#2f3a5c,#252e4a)}}
:root[data-theme="dark"]{--stg:linear-gradient(160deg,#2f3a5c,#252e4a);--bg:#12141c;--card:#1c1f2b;--tx:#eceef6;--mut:#9aa0b8;--bd:#2c3042;--ac:#818cf8;--ac2:#fb7185;--bar:#818cf8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
#stage{width:100%;height:260px;border-radius:10px;overflow:hidden;position:relative;background:var(--stg)}
#stage canvas{display:block;width:100%;height:100%}
.res{text-align:center;font-size:18px;font-weight:700;margin:8px 0 2px;min-height:28px}
.hist{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:26px;margin-bottom:10px}
.hist span{width:24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);font-size:13px;display:grid;place-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:9px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.r{color:var(--ac2);border-color:var(--ac2)}
button:disabled{opacity:.45;cursor:not-allowed}
.cust{display:flex;gap:8px;margin-top:8px}
input{font:inherit;font-size:14px;flex:1;min-width:0;padding:9px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
h2{font-size:15px;margin:0 0 10px}
.total{font-size:14px;color:var(--mut);margin-bottom:8px}.total b{color:var(--tx);font-size:18px}
.chart{position:relative;height:190px;display:flex;align-items:flex-end;gap:10px;padding:0 4px 22px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bar{width:100%;background:var(--bar);border-radius:6px 6px 0 0;min-height:1px}
.bv{font-size:11px;color:var(--mut);margin-bottom:2px}
.bl{position:absolute;bottom:-20px;font-size:13px;font-weight:600}
.theory{position:absolute;left:0;right:0;border-top:2px dashed var(--ac2);pointer-events:none}
.theory i{position:absolute;right:0;top:-18px;font-size:11px;color:var(--ac2);font-style:normal}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:center}th{color:var(--mut);font-weight:600;font-size:12px}
tfoot td{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>🎲 3D 주사위 확률 실험실</h1>
<p class="sub">주사위를 수천 번 굴려 각 눈의 출현 빈도가 이론 확률 1/6(약 16.67%)에 가까워지는 과정을 관찰해 보세요.</p>
<div class="grid">
 <div class="card">
  <div id="stage"></div>
  <div class="res" id="res">주사위를 굴려 보세요</div>
  <div class="hist" id="hist"></div>
  <div class="btns">
   <button class="p" data-n="1">1회 굴리기</button>
   <button class="p" data-n="10">10회</button>
   <button class="p" data-n="100">100회</button>
   <button class="p" data-n="1000">1000회</button>
   <button class="r" id="reset">초기화</button>
  </div>
  <div class="cust"><input id="cn" type="number" min="1" max="100000" value="500" aria-label="사용자 지정 횟수"><button class="p" id="cb">지정 횟수 굴리기</button></div>
 </div>
 <div class="card">
  <h2>출현 빈도 막대 그래프</h2>
  <div class="total">전체 실행 횟수 <b id="tot">0</b>회</div>
  <div class="chart" id="chart"></div>
  <div class="tw"><table>
   <thead><tr><th>눈</th><th>출현 횟수</th><th>백분율(%)</th><th>이론값과 차이</th></tr></thead>
   <tbody id="tb"></tbody>
   <tfoot><tr><td>합계</td><td id="fc">0</td><td id="fp">0.00</td><td>-</td></tr></tfoot>
  </table></div>
 </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var counts=[0,0,0,0,0,0],total=0,hist=[],busy=false,anim=null,tumble=false;
var stage=document.getElementById('stage');
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
var scene=new THREE.Scene();
var cam=new THREE.PerspectiveCamera(40,1,0.1,50);cam.position.set(0,3.2,5.2);cam.lookAt(0,0.2,0);
scene.add(new THREE.AmbientLight(0xffffff,0.75));
var dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(3,6,4);scene.add(dl);

function faceTex(n){
 var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');
 g.fillStyle='#f8f6ef';g.fillRect(0,0,128,128);
 g.strokeStyle='#d8d4c6';g.lineWidth=6;g.strokeRect(3,3,122,122);
 var a=32,m=64,b=96,P={1:[[m,m]],2:[[a,a],[b,b]],3:[[a,a],[m,m],[b,b]],4:[[a,a],[b,a],[a,b],[b,b]],5:[[a,a],[b,a],[m,m],[a,b],[b,b]],6:[[a,a],[b,a],[a,m],[b,m],[a,b],[b,b]]};
 g.fillStyle=n===1?'#d6204a':'#1d2233';
 P[n].forEach(function(p){g.beginPath();g.arc(p[0],p[1],n===1?15:11,0,7);g.fill();});
 var t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}
// BoxGeometry 재질 순서: +x,-x,+y,-y,+z,-z (마주 보는 면의 합 = 7)
var order=[3,4,1,6,2,5];
var normals={3:[1,0,0],4:[-1,0,0],1:[0,1,0],6:[0,-1,0],2:[0,0,1],5:[0,0,-1]};
var mats=order.map(function(n){return new THREE.MeshStandardMaterial({map:faceTex(n),roughness:.45});});
var dice=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5),mats);
var edges=new THREE.LineSegments(new THREE.EdgesGeometry(dice.geometry),new THREE.LineBasicMaterial({color:0x000000}));
edges.scale.setScalar(1.002);dice.add(edges);
dice.quaternion.setFromEuler(new THREE.Euler(.5,.6,.2));scene.add(dice);
var floor=new THREE.Mesh(new THREE.CircleGeometry(2.2,48),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.12}));
floor.rotation.x=-Math.PI/2;floor.position.y=-0.76;scene.add(floor);

function resize(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

function land(r,dur,done){
 var n=normals[r];
 var qa=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(n[0],n[1],n[2]),new THREE.Vector3(0,1,0));
 var qy=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.random()*Math.PI*2);
 anim={t0:performance.now(),dur:dur,qT:qy.multiply(qa),axis:new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize(),
  ang:(2+Math.random()*2)*Math.PI*2,hop:1.1,done:done};
}
var tmp=new THREE.Quaternion();
function loop(now){
 requestAnimationFrame(loop);
 if(anim){
  var t=(now-anim.t0)/anim.dur;
  if(t>=1){dice.quaternion.copy(anim.qT);dice.position.y=0;var d=anim.done;anim=null;if(d)d();}
  else{var e=1-Math.pow(1-t,3);
   tmp.setFromAxisAngle(anim.axis,anim.ang*(1-e));
   dice.quaternion.copy(tmp).multiply(anim.qT);
   dice.position.y=anim.hop*Math.abs(Math.sin(Math.PI*t*2.5))*(1-t);}
 }else if(tumble){
  dice.rotation.x+=.25;dice.rotation.y+=.19;dice.position.y=.3+.2*Math.sin(now/60);
 }
 renderer.render(scene,cam);
}
requestAnimationFrame(loop);

var $=function(i){return document.getElementById(i)};
function setBusy(b){busy=b;document.querySelectorAll('button[data-n],#cb').forEach(function(x){x.disabled=b;});}
function addHist(r){hist.push(r);if(hist.length>20)hist.shift();
 $('hist').innerHTML=hist.map(function(v){return '<span>'+v+'</span>'}).join('');}
function show(r){$('res').textContent='🎯 결과: '+r+'  (누적 '+total.toLocaleString()+'회)';}

(function initTable(){
 var h='',c='';
 for(var i=1;i<=6;i++){
  h+='<tr><td><b>'+i+'</b></td><td id="c'+i+'">0</td><td id="p'+i+'">0.00</td><td id="d'+i+'">-</td></tr>';
  c+='<div class="col"><div class="bv" id="v'+i+'">0%</div><div class="bar" id="b'+i+'" style="height:0%"></div><span class="bl">'+i+'</span></div>';
 }
 $('tb').innerHTML=h;
 $('chart').innerHTML=c+'<div class="theory" id="th"><i>이론 16.67%</i></div>';
})();
var maxPct=50;
function update(){
 $('tot').textContent=total.toLocaleString();$('fc').textContent=total.toLocaleString();
 var mx=0,i,p;
 for(i=0;i<6;i++){p=total?counts[i]/total*100:0;if(p>mx)mx=p;}
 maxPct=Math.max(30,Math.ceil(mx/10)*10+10);
 var sum=0;
 for(i=0;i<6;i++){
  p=total?counts[i]/total*100:0;sum+=p;
  $('c'+(i+1)).textContent=counts[i].toLocaleString();
  $('p'+(i+1)).textContent=p.toFixed(2);
  var df=p-100/6;$('d'+(i+1)).textContent=total?((df>=0?'+':'')+df.toFixed(2)+'%p'):'-';
  $('b'+(i+1)).style.height=(p/maxPct*100)+'%';
  $('v'+(i+1)).textContent=p.toFixed(1)+'%';
 }
 $('fp').textContent=total?sum.toFixed(2):'0.00';
 // 이론선: 막대 영역 높이(주사위 라벨 22px 제외) 기준
 var area=$('chart').clientHeight-22;
 $('th').style.bottom=(22+area*(100/6)/maxPct)+'px';
}
update();

function rollN(n){
 if(busy||!(n>=1))return;n=Math.min(Math.floor(n),100000);setBusy(true);
 if(n===1){
  var r=1+Math.floor(Math.random()*6);
  land(r,1400,function(){counts[r-1]++;total++;addHist(r);show(r);update();setBusy(false);});
  return;
 }
 var arr=new Uint8Array(n),k;for(k=0;k<n;k++)arr[k]=Math.floor(Math.random()*6);
 var dur=Math.min(3500,900+n*8),t0=performance.now(),done=0;tumble=true;
 $('res').textContent='🎲 '+n.toLocaleString()+'회 시뮬레이션 중...';
 (function step(now){
  var t=Math.min(1,(now-t0)/dur),target=Math.floor(n*t);
  for(;done<target;done++){counts[arr[done]]++;total++;}
  update();
  if(t<1){requestAnimationFrame(step);return;}
  for(;done<n;done++){counts[arr[done]]++;total++;}
  tumble=false;update();
  var last=arr[n-1]+1;
  land(last,900,function(){for(var j=Math.max(0,n-20);j<n;j++)addHist(arr[j]+1);show(last);setBusy(false);});
 })(performance.now());
}
document.querySelectorAll('button[data-n]').forEach(function(b){b.onclick=function(){rollN(+b.dataset.n);};});
$('cb').onclick=function(){rollN(+$('cn').value);};
$('reset').onclick=function(){
 anim=null;tumble=false;counts=[0,0,0,0,0,0];total=0;hist=[];$('hist').innerHTML='';
 $('res').textContent='초기화되었습니다. 주사위를 굴려 보세요';setBusy(false);update();
};
})();
</script>
</body>
</html>
