    // --- Header Component ---
    function Header({ timeRemaining, setTimeRemaining, timerRunning, setTimerRunning, onAddGroup, onResetSession, groupCount }) {
      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
      };

      useEffect(() => {
        let interval = null;
        if (timerRunning && timeRemaining > 0) {
          interval = setInterval(() => {
            setTimeRemaining((prev) => prev - 1);
          }, 1000);
        } else if (timeRemaining === 0) {
          setTimerRunning(false);
        }
        return () => clearInterval(interval);
      }, [timerRunning, timeRemaining]);

      const presetTimes = [
        { label: "5분", value: 300 },
        { label: "10분", value: 600 },
        { label: "15분", value: 900 },
      ];

      const handleTimePreset = (seconds) => {
        setTimerRunning(false);
        setTimeRemaining(seconds);
      };

      const isLowTime = timeRemaining > 0 && timeRemaining < 60;

      return (
        <header className="bg-white border-b-4 border-vibrant-red text-vibrant-dark py-4 px-6 md:px-12 sticky top-0 z-40 shadow-sm">
          <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-4">
              <div className="h-11 w-11 rounded-2xl bg-vibrant-red flex items-center justify-center shadow-md relative animate-pulse">
                <HeartPulse className="h-6 w-6 text-white" />
                <span className="absolute -top-1 -right-1 flex h-3 w-3">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-300 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                </span>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="bg-vibrant-red/10 text-vibrant-red text-[10px] font-mono tracking-wider font-extrabold uppercase px-2 py-0.5 rounded border border-vibrant-red/30">
                    EDUTECH FIRST-AID KIT
                  </span>
                </div>
                <h1 className="text-2xl font-black text-vibrant-dark tracking-tight italic">
                  좋은 수업 응급처치 <span className="text-vibrant-red text-lg font-bold not-italic">Rx</span>
                </h1>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3 bg-amber-50 border-2 border-amber-400 p-2.5 px-4 rounded-full shadow-inner w-full md:w-auto justify-center md:justify-start">
              <div className="flex items-center gap-2">
                <span className={`w-3 h-3 rounded-full shrink-0 ${isLowTime || timerRunning ? "bg-red-500 animate-pulse" : "bg-yellow-400"}`}></span>
                <span className="text-xs text-amber-900 font-bold">처방 제한시간:</span>
              </div>

              <div className={`font-mono text-2xl font-black tracking-wider tabular-nums transition-all ${
                isLowTime ? "text-red-600 animate-pulse scale-105" : timeRemaining === 0 ? "text-red-500" : "text-amber-800"
              }`}>
                {formatTime(timeRemaining)}
              </div>

              <div className="flex items-center gap-1.5 ml-1">
                <button
                  onClick={() => setTimerRunning(!timerRunning)}
                  disabled={timeRemaining === 0}
                  className={`p-1.5 rounded-full transition-colors cursor-pointer ${
                    timerRunning ? "bg-amber-600/25 text-amber-900 hover:bg-amber-600/40" : "bg-emerald-600/20 text-emerald-800 hover:bg-emerald-600/30"
                  }`}
                  title={timerRunning ? "일시정지" : "시작"}
                >
                  {timerRunning ? <Pause className="h-4 w-4" /> : <Play className="h-4 w-4" />}
                </button>

                <button
                  onClick={() => handleTimePreset(600)}
                  className="p-1.5 rounded-full bg-amber-200/50 text-amber-800 hover:bg-amber-200 transition-colors cursor-pointer"
                  title="리셋 (10분)"
                >
                  <RotateCcw className="h-4 w-4" />
                </button>
              </div>

              <div className="hidden lg:flex items-center gap-1 pl-2 border-l border-amber-200">
                {presetTimes.map((preset) => (
                  <button
                    key={preset.value}
                    onClick={() => handleTimePreset(preset.value)}
                    className={`text-[10px] px-2.5 py-1 rounded-full font-bold transition-all cursor-pointer ${
                      timeRemaining === preset.value ? "bg-vibrant-red text-white" : "bg-amber-100 text-amber-800 hover:bg-amber-200"
                    }`}
                  >
                    {preset.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={onAddGroup}
                className="flex items-center gap-1.5 bg-vibrant-red hover:bg-red-500 text-white text-xs font-black px-4 py-2.5 rounded-xl transition-all cursor-pointer shadow-[0_3px_0_#C44141] hover:translate-y-[1px] active:translate-y-[2px]"
              >
                <PlusCircle className="h-4 w-4" />
                개인 추가
              </button>
              <button
                onClick={onResetSession}
                className="text-xs font-bold text-slate-500 hover:text-slate-800 px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors cursor-pointer border border-slate-300"
                title="초기 상태로 복원"
              >
                초기화
              </button>
            </div>
          </div>
        </header>
      );
    }

    // --- Cabinet Component ---
    function Cabinet() {
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("all");

      const categories = [
        { id: "all", label: "전체 상비약" },
        { id: "interaction", label: "상호작용/투표" },
        { id: "collaboration", label: "협동/보드" },
        { id: "quiz", label: "퀴즈/게임" },
        { id: "creation", label: "시각 창작" },
        { id: "management", label: "학급 경영" },
      ];

      const filteredTools = useMemo(() => {
        return EDUTECH_CABINET.filter((tool) => {
          const matchCategory = selectedCategory === "all" || tool.category === selectedCategory;
          const matchSearch =
            tool.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            tool.desc.toLowerCase().includes(searchTerm.toLowerCase()) ||
            tool.tags.some((tag) => tag.toLowerCase().includes(searchTerm.toLowerCase())) ||
            tool.recommendedSituation.toLowerCase().includes(searchTerm.toLowerCase());
          return matchCategory && matchSearch;
        });
      }, [searchTerm, selectedCategory]);

      return (
        <div className="bg-white rounded-3xl border border-slate-200 p-6 md:p-8 shadow-sm space-y-6">
          <div>
            <h2 className="text-xl font-black text-vibrant-dark flex items-center gap-2">
              <BookOpen className="h-6 w-6 text-vibrant-teal" />
              에듀테크 상비약 종합 보관함 (Edutech Cabinet)
            </h2>
            <p className="text-xs text-slate-500 font-bold mt-1">
              수업 위급 상황에 신속히 투약할 수 있는 주요 에듀테크 약효 성분 및 권장 적응증 사전입니다.
            </p>
          </div>

          <div className="flex flex-col md:flex-row gap-4 justify-between items-center">
            <div className="flex flex-wrap gap-1.5 w-full md:w-auto">
              {categories.map((c) => (
                <button
                  key={c.id}
                  onClick={() => setSelectedCategory(c.id)}
                  className={`text-xs font-bold px-3 py-1.5 rounded-xl transition-all cursor-pointer ${
                    selectedCategory === c.id
                      ? "bg-slate-900 text-white shadow-sm"
                      : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                  }`}
                >
                  {c.label}
                </button>
              ))}
            </div>

            <div className="w-full md:w-72">
              <input
                type="text"
                placeholder="도구명, 태그, 교실 증상 검색..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full px-4 py-2 border-2 border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-vibrant-teal focus:border-vibrant-teal outline-none"
              />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            {filteredTools.map((tool) => (
              <div
                key={tool.id}
                className="border-2 border-slate-200 hover:border-vibrant-teal rounded-2xl p-5 bg-slate-50/50 hover:bg-white transition-all flex flex-col justify-between space-y-4 group"
              >
                <div className="space-y-3">
                  <div className="flex items-start justify-between">
                    <h3 className="font-extrabold text-slate-900 text-sm group-hover:text-vibrant-teal transition-colors">
                      💊 {tool.name}
                    </h3>
                  </div>

                  <p className="text-xs text-slate-600 font-medium leading-relaxed">
                    {tool.desc}
                  </p>

                  <div className="bg-amber-50/80 p-3 rounded-xl border border-amber-200 text-[11px] text-amber-900 font-bold space-y-1">
                    <span className="text-[10px] uppercase tracking-wider text-amber-700 block font-black">
                      🎯 권장 적응 교실 증상:
                    </span>
                    <p className="leading-normal">{tool.recommendedSituation}</p>
                  </div>
                </div>

                <div className="flex flex-wrap gap-1 pt-3 border-t border-slate-200">
                  {tool.tags.map((t, idx) => (
                    <span key={idx} className="bg-white border border-slate-200 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded-md">
                      #{t}
                    </span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- Prescription Card Component ---
    function PrescriptionCard({ group, onEdit, onDelete, onReact, onAddComment, onDeleteComment }) {

      const [commentInput, setCommentInput] = useState("");
      const [showComments, setShowComments] = useState(false);

      const getTheme = () => {
        const identifier = (group.id + group.name).toLowerCase();
        if (identifier.includes("1") || identifier.includes("group-1")) {
          return {
            bgClass: "bg-vibrant-red",
            borderClass: "border-vibrant-red",
            shadowClass: "vibrant-shadow-red",
            lightBg: "bg-red-50/90 border-2 border-dashed border-vibrant-red",
            textAccent: "text-vibrant-red",
          };
        } else if (identifier.includes("2") || identifier.includes("group-2")) {
          return {
            bgClass: "bg-vibrant-teal",
            borderClass: "border-vibrant-teal",
            shadowClass: "vibrant-shadow-teal",
            lightBg: "bg-emerald-50/90 border-2 border-dashed border-vibrant-teal",
            textAccent: "text-vibrant-teal",
          };
        } else {
          return {
            bgClass: "bg-vibrant-blue",
            borderClass: "border-vibrant-blue",
            shadowClass: "vibrant-shadow-blue",
            lightBg: "bg-blue-50/90 border-2 border-dashed border-vibrant-blue",
            textAccent: "text-vibrant-blue",
          };
        }
      };

      const theme = getTheme();

      const handleCommentSubmit = (e) => {
        e.preventDefault();
        if (!commentInput.trim()) return;
        const author = authorName.trim() || `${group.name}의 동료 교사`;
        onAddComment(group.id, author, commentInput.trim());
        setCommentInput("");

      return (

              <span className={`text-xs font-black uppercase block mb-1 underline ${theme.textAccent} flex items-center gap-1`}>
                <ShieldAlert className="h-3.5 w-3.5" />
                응급 진찰 증상 (Class Symptom)
              </span>
              <h4 className="text-base font-black text-slate-800 leading-snug">
                "{group.problemTitle || "진단된 수업 문제 증상이 없습니다."}"
              </h4>
              {group.problemDesc && (
                <p className="text-xs text-slate-600 mt-2 font-medium bg-white/70 p-2.5 rounded-xl border border-white">
                  {group.problemDesc}
                </p>
              )}
            </div>

            {group.cause && (
              <div className="space-y-1.5">
                <span className="text-xs font-black text-gray-400 uppercase tracking-widest block">
                  1. 원인 분석 및 소견 (Diagnosis)
                </span>
                <div className="bg-gray-50 p-4 rounded-2xl border-2 border-gray-200 text-xs font-bold leading-relaxed text-gray-700">
                  {group.cause}
                </div>
              </div>
            )}

            {group.tools && group.tools.length > 0 && (
              <div className="space-y-1.5">
                <span className="text-xs font-black text-gray-400 uppercase tracking-widest block">
                  2. 에듀테크 처방 및 약효 (Edutech Remedy)
                </span>
                <div className="flex flex-wrap gap-1.5">
                  {group.tools.map((tool, index) => (
                    <div
                      key={index}
                      className="flex items-center gap-1.5 bg-blue-50/80 p-2 px-3 rounded-xl border border-blue-200"
                    >
                      <div className="w-5 h-5 bg-blue-500 rounded-lg flex items-center justify-center text-white text-[10px] font-black">
                        {tool.charAt(0)}
                      </div>
                      <span className="font-extrabold text-blue-700 text-xs">{tool}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {group.element && (
              <div className="space-y-1.5">
                <span className="text-xs font-black text-gray-400 uppercase tracking-widest block">
                  3. 좋은 수업 연결 축 (Therapeutic Element)
                </span>
                <p className="text-xs text-gray-700 font-extrabold italic leading-snug bg-amber-50 p-3 rounded-xl border-2 border-amber-200">
                  "🧬 {group.element}"
                  {group.extraNotes && <span className="block mt-1 text-[11px] text-slate-500 not-italic font-medium">({group.extraNotes})</span>}
                </p>
              </div>
            )}

            {group.studentResponse && (
              <div className="space-y-2 bg-emerald-50/75 p-4 border-2 border-dashed border-emerald-300 rounded-3xl animate-in fade-in">
                <span className="text-[10px] font-black text-emerald-800 uppercase tracking-wider block flex items-center gap-1">
                  💬 실제 학생 개별 반응 결과 (Student Direct Feedback)
                </span>
                <p className="text-xs text-emerald-950 font-extrabold leading-relaxed">
                  "{group.studentResponse}"
                </p>
              </div>
            )}

            {group.aiPrescription ? (
              <div className="mt-5 border-4 border-amber-400 bg-amber-50/50 p-4 rounded-3xl relative overflow-hidden">
                <div className={`absolute right-3 -bottom-1 opacity-20 h-16 w-16 rounded-full flex flex-col items-center justify-center font-black border-4 select-none ${
                  group.aiPrescription.rating === "S" ? "border-amber-500 text-amber-500" : "border-emerald-500 text-emerald-500"
                }`}>
                  <span className="text-[7px] font-mono leading-none tracking-widest uppercase">RX LAB</span>
                  <span className="text-xl leading-none">{group.aiPrescription.rating}</span>
                </div>

                <div className="flex items-center gap-2 mb-2">
                  <div className="h-6 w-6 rounded-full flex items-center justify-center text-xs font-black font-mono shadow-sm bg-amber-400 text-vibrant-dark border border-amber-500">
                    {group.aiPrescription.rating}
                  </div>
                  <span className="text-xs text-amber-950 font-black flex items-center gap-1">
                    <Sparkles className="h-4 w-4 text-amber-600" />
                    AI 전문의 처방 진단서 (Rx Verification)
                  </span>
                </div>

                <p className="text-xs text-amber-900 leading-relaxed font-bold bg-white/80 p-3 rounded-2xl border border-amber-100">
                  {group.aiPrescription.reviewText}
                </p>
              </div>
            ) : (
              <div className="mt-4 pt-3 border-t border-slate-100 bg-slate-50/50 p-4 rounded-2xl text-center">
                <p className="text-[11px] text-slate-500 font-bold">
                  [처방전 작성/감수하기]를 클릭하여 에듀테크 AI 닥터 감수를 신청하시면 안전 소견서가 발급됩니다.
                </p>
              </div>
            )}
          </div>

          <div className="bg-slate-50 px-5 py-3 border-t border-slate-100 flex items-center justify-between gap-1 overflow-x-auto select-none">
            <span className="text-xs font-black text-slate-500 shrink-0">동료 반응:</span>
            <div className="flex items-center gap-2">
              <button
                onClick={() => onReact(group.id, "good")}
                className="flex items-center gap-1 py-1.5 px-3 bg-white border-2 border-slate-200 hover:border-slate-400 rounded-xl text-xs font-bold text-slate-700 transition-all cursor-pointer"
              >
                <ThumbsUp className="h-3.5 w-3.5 text-blue-500" />
                <span>멋져</span>
                <span className="bg-slate-100 text-slate-800 rounded px-1.5 text-[10px] font-black">{group.reactions.good}</span>
              </button>
              
              <button
                onClick={() => onReact(group.id, "perfect")}
                className="flex items-center gap-1 py-1.5 px-3 bg-white border-2 border-slate-200 hover:border-slate-400 rounded-xl text-xs font-bold text-slate-700 transition-all cursor-pointer"
              >
                <Heart className="h-3.5 w-3.5 text-red-500 fill-red-400" />
                <span>완벽</span>
                <span className="bg-slate-100 text-slate-800 rounded px-1.5 text-[10px] font-black">{group.reactions.perfect}</span>
              </button>

              <button
                onClick={() => onReact(group.id, "creative")}
                className="flex items-center gap-1 py-1.5 px-3 bg-white border-2 border-slate-200 hover:border-slate-400 rounded-xl text-xs font-bold text-slate-700 transition-all cursor-pointer"
              >
                <Lightbulb className="h-3.5 w-3.5 text-amber-500 fill-amber-100" />
                <span>참신</span>
                <span className="bg-slate-100 text-slate-800 rounded px-1.5 text-[10px] font-black">{group.reactions.creative}</span>
              </button>

              <button
                onClick={() => onReact(group.id, "cure")}
                className="flex items-center gap-1 py-1.5 px-3 bg-white border-2 border-slate-200 hover:border-slate-400 rounded-xl text-xs font-bold text-slate-700 transition-all cursor-pointer"
              >
                <HeartPulse className="h-3.5 w-3.5 text-emerald-500" />
                <span>완치</span>
                <span className="bg-slate-100 text-slate-800 rounded px-1.5 text-[10px] font-black">{group.reactions.cure}</span>
              </button>
            </div>
          </div>

          <div className="bg-white border-t border-slate-100">
            <button
              onClick={() => setShowComments(!showComments)}
              className="w-full py-3.5 px-5 flex items-center justify-between text-vibrant-dark hover:text-vibrant-red transition-colors text-xs font-black bg-slate-50/50"
            >
              <span className="flex items-center gap-2">
                <MessageSquare className="h-4 w-4 text-vibrant-teal" />
                동료 장벽 조치 건의 및 의견 ({group.comments.length})
              </span>
              <span className="text-gray-400 font-bold">
                {showComments ? "의견 접기 ▲" : "의견 열기 ▼"}
              </span>
            </button>

            {showComments && (
              <div className="p-4 bg-slate-50/80 border-t border-slate-100 space-y-4">
                <div className="space-y-2.5 max-h-[160px] overflow-y-auto pr-1">
                  {group.comments.length === 0 ? (
                    <p className="text-xs text-slate-400 italic text-center py-2">아직 등록된 동료 조언이 없습니다. 첫 의견을 남겨주세요!</p>
                  ) : (
                    group.comments.map((comment) => (
                      <div key={comment.id} className="bg-white p-3 rounded-2xl border-2 border-slate-200 text-xs text-slate-700 relative group/cmt shadow-sm">
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-extrabold text-vibrant-dark text-xs">👤 {comment.author}</span>
                          <div className="flex items-center gap-2">
                            <span className="text-[10px] text-gray-400 font-mono">{comment.createdAt}</span>
                            {onDeleteComment && (
                              <button
                                onClick={() => onDeleteComment(group.id, comment.id)}
                                className="text-gray-400 hover:text-red-500 transition-colors"
                              >
                                <Trash2 className="h-3 w-3" />
                              </button>
                            )}
                          </div>
                        </div>
                        <p className="text-gray-800 font-medium leading-relaxed">{comment.text}</p>
                      </div>
                    ))
                  )}
                </div>

                <form onSubmit={handleCommentSubmit} className="space-y-2 pt-2 border-t border-slate-200">
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="교사 성함 / 닉네임"
                      value={authorName}
                      onChange={(e) => setAuthorName(e.target.value)}
                      className="w-36 p-2 text-xs border-2 border-slate-200 rounded-xl focus:border-vibrant-teal outline-none font-bold"
                    />
                    <input
                      type="text"
                      placeholder="처방 보강 의견이나 팁을 입력하세요..."
                      value={commentInput}
                      onChange={(e) => setCommentInput(e.target.value)}
                      className="flex-1 p-2 text-xs border-2 border-slate-200 rounded-xl focus:border-vibrant-teal outline-none font-medium"
                    />
                    <button
                      type="submit"
                      className="px-3 py-2 bg-vibrant-dark text-white rounded-xl text-xs font-bold hover:bg-black transition-colors cursor-pointer flex items-center gap-1"
                    >
                      <Send className="h-3.5 w-3.5" />
                    </button>
                  </div>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- Prescription Maker Modal Component ---
    function PrescriptionMaker({ group, onSave, onClose }) {
      const [step, setStep] = useState(1);
      const [groupName, setGroupName] = useState(group.name);
      const [problemTitle, setProblemTitle] = useState(group.problemTitle);
      const [problemDesc, setProblemDesc] = useState(group.problemDesc);
      const [cause, setCause] = useState(group.cause);
      const [selectedTools, setSelectedTools] = useState(group.tools || []);
      const [customToolInput, setCustomToolInput] = useState("");
      const [selectedElement, setSelectedElement] = useState(group.element || GOOD_LESSON_ELEMENTS[0]);
      const [extraNotes, setExtraNotes] = useState(group.extraNotes || "");
      const [studentResponse, setStudentResponse] = useState(group.studentResponse || "");

      const [aiLoading, setAiLoading] = useState(false);
      const [aiFeedback, setAiFeedback] = useState(group.aiPrescription || null);
      const [loadingStage, setLoadingStage] = useState(0);

      const handleAutoGenerateStudentResponse = () => {
        let responseText = "";
        const toolList = selectedTools.join(", ");
        
        if (groupName.includes("김민수") || problemTitle.includes("소극적") || problemTitle.includes("집중하지")) {
          responseText = `익명 투표인 ${toolList || "멘티미터"} 덕분에 다른 친구들 정답 눈치나 평가에 대한 두려움 없이 '사실 수학 공식을 이해하기 어렵다'고 진솔하게 입장을 누를 수 있었어요. 제 의견이 실시간 시각 그래프에 한 구성원으로 올라가는 걸 보면서, 조용히 잠자던 저 스스로도 진짜 수업 주체로 인정받는다는 소중한 만족감이 충전되었습니다!`;
        } else if (groupName.includes("이지현") || problemTitle.includes("무임승차") || problemTitle.includes("참여율")) {
          responseText = `항상 모둠 과제만 하면 발표 잘하는 친구 한 명만 오롯이 활동지 피피티를 독점 편집하고 저는 낙오되어 스마트폰 딴짓을 보냈었어요. 하지만 ${toolList || "구글 슬라이드/패들렛"} 처방 덕분에 기여 인성 구역 장치에 제 지분 카드가 똑부러지게 배분되어, 눈치 볼 필요 없이 제 고유의 의견 분석을 완성해 당당히 한 장의 지분을 완수했답니다!`;
        } else if (groupName.includes("박준호") || problemTitle.includes("편차") || problemTitle.includes("수준")) {
          responseText = `학습 속도가 느려서 뒤처지면 아예 포기하고 딴생각으로 수업을 이탈하곤 했습니다. 그런데 이 ${toolList || "퀴지즈"} 처방은 단체 타이머에 쫓기지 않고, 제 태블릿 화면 안에서 제 페이스대로 편하게 질문을 읽고 조율해 풀어나갈 수 있어 부담이 없었습니다! 오답 구호 힌트 스마트 카드 성분이 끊임없이 저를 토닥여 끝내 한 바퀴를 전원 완주했습니다.`;
        } else {
          responseText = `해당 처방 에듀테크인 '${toolList || "선택된 에듀테크"}'의 적용을 통해, 지목 심리 장벽이 걷혀서 제 개인적인 의견을 안전지대에 직접 클릭해 제출할 수 있었습니다. 주입식 수업의 침묵에서 탈피해 제 몫을 완성하고 참여하는 즐거운 효능감이 온몸에 전달되었습니다!`;
        }
        setStudentResponse(responseText);
      };

      const loadingStages = [
        "처방 내역 기초 문진을 수거하는 중...",
        "에듀테크 상비약의 분자식 배합 반응 분석 중...",
        "좋은 수업 기전 연결 효과 시뮬레이션 중...",
        "AI 전문의 안전 감수 소견서 출력 중..."
      ];

      const handleSelectPreset = (preset) => {
        setProblemTitle(preset.title);
        setProblemDesc(preset.desc);
        if (!cause) {
          setCause(preset.defaultCauseHint);
        }
      };

      const handleToggleTool = (toolName) => {
        if (selectedTools.includes(toolName)) {
          setSelectedTools(selectedTools.filter((t) => t !== toolName));
        } else {
          setSelectedTools([...selectedTools, toolName]);
        }
      };

      const handleAddCustomTool = (e) => {
        e.preventDefault();
        if (!customToolInput.trim()) return;
        if (!selectedTools.includes(customToolInput.trim())) {
          setSelectedTools([...selectedTools, customToolInput.trim()]);
        }
        setCustomToolInput("");
      };

      const handleRequestAi = () => {
        setAiLoading(true);
        setLoadingStage(0);

        let stage = 0;
        const interval = setInterval(() => {
          stage += 1;
          if (stage < loadingStages.length) {
            setLoadingStage(stage);
          } else {
            clearInterval(interval);
            finishAiSimulation();
          }
        }, 600);
      };

      const finishAiSimulation = () => {
        setAiLoading(false);
        const toolsList = selectedTools.length > 0 ? selectedTools.join(", ") : "기본 관찰 처방";
        
        let rating = "A";
        let review = "";
        let mech = "";
        let side = "";
        let tip = "";

        if (selectedTools.length >= 1 && cause.length > 20) {
          rating = "S";
          review = `매우 탁월하고 즉효성이 뛰어난 전문 처방전입니다! '${problemTitle}' 현상에 대해 '${toolsList}'을(를) 투약하여 [${selectedElement}] 약효를 완벽히 끌어올렸습니다.`;
          mech = `학생들의 고립 방어막을 허물고 전원 참여의 기전이 촉발되어 교실 내 침묵과 양극화가 획기적으로 완화됩니다.`;
          side = `수업 초반 로그인 혼선이나 지나친 게임성 과몰입으로 본질적인 교과 내용 전달 시간이 침범당할 우려가 있습니다.`;
          tip = `초반 3분 동안 교사의 룰 브리핑 백신을 명확히 선제 투여한 후 조별 기여 카드를 실시간 점검하세요.`;
        } else {
          rating = "B";
          review = `기초 처방의 틀이 갖추어졌으나, 도구 배합과 원인 분석의 연계성을 조금 더 보강하면 더욱 강력한 치료 효능을 낼 수 있습니다.`;
          mech = `선택된 에듀테크 성분이 일시적 주의 환기에는 기여하나 지속적인 자기주도 동기로 전이되기 위한 사후 활동이 보완되어야 합니다.`;
          side = `단발성 사용에 그쳐 학생들의 기여도가 다시 소수의 주도자로 편중될 수 있습니다.`;
          tip = `1인 1슬라이드 책임 분담 또는 익명 의견 모음판을 추가하여 처방의 지속력을 높이세요.`;
        }

        setAiFeedback({
          rating,
          reviewText: review,
          mechanism: mech,
          sideEffects: side,
          synergyTip: tip,
        });

        if (!studentResponse) {
          handleAutoGenerateStudentResponse();
        }
      };

      const handleSave = () => {
        onSave({
          ...group,
          name: groupName,
          problemTitle,
          problemDesc,
          cause,
          tools: selectedTools,
          element: selectedElement,
          extraNotes,
          studentResponse,
          aiPrescription: aiFeedback,
          status: aiFeedback ? "complete" : selectedTools.length > 0 ? "prescribed" : "diagnosing",
          updatedAt: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto animate-in fade-in">
          <div className="bg-white w-full max-w-4xl rounded-3xl border-4 border-vibrant-dark shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            
            {/* Modal Header */}
            <div className="bg-vibrant-red p-5 text-white flex items-center justify-between border-b-4 border-vibrant-dark">
              <div className="flex items-center gap-3">
                <div className="h-10 w-10 bg-white text-vibrant-red rounded-2xl flex items-center justify-center font-black text-xl shadow-sm">
                  Rx
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      value={groupName}
                      onChange={(e) => setGroupName(e.target.value)}
                      className="bg-white text-vibrant-dark font-black text-sm rounded-xl px-3 py-1.5 border-2 border-vibrant-dark focus:outline-none focus:bg-amber-50 w-36"
                      placeholder="학생 이름 또는 특징"
                    />
                    <span className="text-vibrant-red bg-white border-2 border-vibrant-dark font-black font-mono text-[10px] tracking-wider px-2 py-1 rounded-full">
                      PRESCRIPTION LAB
                    </span>
                  </div>
                  <h2 className="text-lg font-black mt-1">에듀테크 상비약 처방 및 임상 감수</h2>
                </div>
              </div>
              <button onClick={onClose} className="p-2 rounded-xl bg-white/20 hover:bg-white/40 text-white transition-colors cursor-pointer">
                <X className="h-5 w-5" />
              </button>
            </div>

            {/* Stepper Wizard Bar */}
            <div className="bg-slate-100 px-6 py-3 border-b-2 border-slate-200 flex justify-between items-center text-xs font-bold overflow-x-auto gap-2">
              {[
                { s: 1, label: "1. 증상 선택" },
                { s: 2, label: "2. 원인 진찰" },
                { s: 3, label: "3. 에듀테크 상비약" },
                { s: 4, label: "4. 좋은 수업 & 학생 답변" },
                { s: 5, label: "5. AI 닥터 감수" },
              ].map((item) => (
                <button
                  key={item.s}
                  onClick={() => setStep(item.s)}
                  className={`px-3 py-1.5 rounded-xl transition-all whitespace-nowrap cursor-pointer ${
                    step === item.s
                      ? "bg-vibrant-red text-white shadow-sm font-black"
                      : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-50"
                  }`}
                >
                  {item.label}
                </button>
              ))}
            </div>

            {/* Modal Body */}
            <div className="p-6 md:p-8 overflow-y-auto flex-1 space-y-6">
              {step === 1 && (
                <div className="space-y-5">
                  <div>
                    <h3 className="text-base font-black text-vibrant-dark mb-1">이 학생이 마주한 교실 위급 증상은 무엇입니까?</h3>
                    <p className="text-xs text-slate-500 font-bold">대표 고질병 프리셋을 선택하거나 직접 상황을 기술할 수 있습니다.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {PRESET_PROBLEMS.map((preset) => (
                      <div
                        key={preset.id}
                        onClick={() => handleSelectPreset(preset)}
                        className={`p-4 rounded-2xl border-2 transition-all cursor-pointer ${
                          problemTitle === preset.title
                            ? "border-vibrant-red bg-red-50/50 shadow-sm"
                            : "border-slate-200 hover:border-slate-300 bg-white"
                        }`}
                      >
                        <h4 className="font-extrabold text-xs text-slate-900 mb-1">🚨 {preset.title}</h4>
                        <p className="text-[11px] text-slate-500 font-medium line-clamp-2 leading-relaxed">{preset.desc}</p>
                      </div>
                    ))}
                  </div>

                  <div className="space-y-3 pt-3 border-t border-slate-100">
                    <label className="block text-xs font-black text-slate-700">진단 증상 제목</label>
                    <input
                      type="text"
                      value={problemTitle}
                      onChange={(e) => setProblemTitle(e.target.value)}
                      placeholder="예: 조별 토의만 시키면 침묵하거나 특정 학생만 주도함"
                      className="w-full p-3 border-2 border-slate-200 rounded-xl text-xs font-bold focus:border-vibrant-red outline-none"
                    />

                    <label className="block text-xs font-black text-slate-700">상세 정황 묘사</label>
                    <textarea
                      rows={3}
                      value={problemDesc}
                      onChange={(e) => setProblemDesc(e.target.value)}
                      placeholder="수업 시간 중 구체적으로 학생이 보이는 거부 반응이나 어려움을 묘사하세요."
                      className="w-full p-3 border-2 border-slate-200 rounded-xl text-xs focus:border-vibrant-red outline-none"
                    />
                  </div>
                </div>
              )}

              {step === 2 && (
                <div className="space-y-4">
                  <div>
                    <h3 className="text-base font-black text-vibrant-dark mb-1">교실 증상의 핵심 근본 원인 정밀 감정</h3>
                    <p className="text-xs text-slate-500 font-bold">어째서 이러한 상황이나 거부 거동이 발현되는지 개별 관찰을 통해 진찰해낸 핵심 원인을 기술하세요.</p>
                  </div>

                  <textarea
                    rows={6}
                    value={cause}
                    onChange={(e) => setCause(e.target.value)}
                    placeholder="예: 일방향 주입식 수업으로 발표 시 틀렸을 때의 심리적 부담감이 너무 크고, 자신의 생각을 표현할 비동기 익명 통로가 차단되어 있음."
                    className="w-full p-4 border-2 border-slate-200 rounded-2xl text-xs leading-relaxed font-medium focus:border-vibrant-red outline-none"
                  />
                </div>
              )}

              {step === 3 && (
                <div className="space-y-5">
                  <div>
                    <h3 className="text-base font-black text-vibrant-dark mb-1">투약할 에듀테크 상비약 배합</h3>
                    <p className="text-xs text-slate-500 font-bold">진단된 병증을 완화할 상비약을 클릭하여 처방전에 조제하세요 (중복 선택 가능).</p>
                  </div>

                  <div className="flex flex-wrap gap-2">
                    {EDUTECH_CABINET.map((tool) => {
                      const isSelected = selectedTools.includes(tool.name);
                      return (
                        <button
                          key={tool.id}
                          type="button"
                          onClick={() => handleToggleTool(tool.name)}
                          className={`text-xs font-bold px-3 py-2 rounded-xl border-2 transition-all cursor-pointer flex items-center gap-1.5 ${
                            isSelected
                              ? "bg-vibrant-teal text-white border-vibrant-teal shadow-sm font-black"
                              : "bg-white text-slate-700 border-slate-200 hover:border-slate-300"
                          }`}
                        >
                          <span>💊</span>
                          <span>{tool.name}</span>
                          {isSelected && <span>✓</span>}
                        </button>
                      );
                    })}
                  </div>

                  <form onSubmit={handleAddCustomTool} className="flex gap-2 pt-3 border-t border-slate-100">
                    <input
                      type="text"
                      placeholder="사전에 없는 다른 에듀테크 직접 등록 (예: 잼보드, 미로 등)"
                      value={customToolInput}
                      onChange={(e) => setCustomToolInput(e.target.value)}
                      className="flex-1 p-2.5 border-2 border-slate-200 rounded-xl text-xs font-medium focus:border-vibrant-teal outline-none"
                    />
                    <button
                      type="submit"
                      className="px-4 py-2 bg-slate-900 hover:bg-black text-white text-xs font-black rounded-xl cursor-pointer"
                    >
                      직접 배합 추가
                    </button>
                  </form>

                  {selectedTools.length > 0 && (
                    <div className="bg-teal-50 p-4 rounded-2xl border border-teal-200">
                      <span className="text-xs font-black text-teal-900 block mb-2">현재 조제된 처방 배합 목록:</span>
                      <div className="flex flex-wrap gap-1.5">
                        {selectedTools.map((t, idx) => (
                          <span key={idx} className="bg-white border border-teal-300 text-teal-800 text-xs font-black px-2.5 py-1 rounded-lg">
                            {t}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {step === 4 && (
                <div className="space-y-6">
                  <div>
                    <h3 className="text-base font-black text-vibrant-dark mb-1">좋은 수업 성분 매칭 및 학생 개별 답변 구상</h3>
                    <p className="text-xs text-slate-500 font-bold">선택한 에듀테크 처방이 어떤 좋은 수업 가치와 연결되는지, 그리고 실제 학생이 이 에듀테크를 사용하여 어떻게 솔직하게 답변하고 반응할 것인지 기록하세요.</p>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-black text-slate-800 mb-1.5">연결할 좋은 수업 핵심 약효 원소</label>
                        <select
                          value={selectedElement}
                          onChange={(e) => setSelectedElement(e.target.value)}
                          className="w-full p-3 bg-white border-2 border-slate-200 rounded-xl text-xs font-bold focus:border-vibrant-red outline-none text-slate-800 cursor-pointer"
                        >
                          {GOOD_LESSON_ELEMENTS.map((el, idx) => (
                            <option key={idx} value={el}>
                              🧬 {el}
                            </option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-black text-slate-800 mb-1.5">처방 효과 설명 및 동료 가이드 (선택 사항)</label>
                        <textarea
                          rows={5}
                          placeholder="예: 멘티미터를 활용해 스마트폰 실시간 투표를 병행하면 부끄러움이 많은 학생도 정답 맞추기 참여를 즉흥적으로 쏟아낼 것입니다."
                          value={extraNotes}
                          onChange={(e) => setExtraNotes(e.target.value)}
                          className="w-full p-3 border-2 border-slate-200 rounded-xl text-xs focus:border-vibrant-red outline-none"
                        />
                      </div>
                    </div>

                    <div className="space-y-4 bg-emerald-50/50 p-5 rounded-3xl border-2 border-dashed border-emerald-300">
                      <div className="flex items-center justify-between">
                        <label className="block text-xs font-black text-emerald-950">
                          💬 적용 후 '실제 학생 개별 참여 답변 결과' 구상
                        </label>
                        <button
                          type="button"
                          onClick={handleAutoGenerateStudentResponse}
                          className="text-[10px] bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-2.5 py-1 rounded-lg flex items-center gap-1 transition-all cursor-pointer shadow-sm"
                        >
                          <span>체험 답변 자동 배합 🪄</span>
                        </button>
                      </div>
                      <p className="text-[10px] text-emerald-800 font-medium">선택된 처방을 투약받았을 때, 해당 학생이 디바이스를 통해 입력 및 제출하는 실제 상황 체험 발화 내용입니다.</p>
                      <textarea
                        rows={5}
                        placeholder="예: 남들 앞에서 정답이 틀릴까 봐 조마조마하고 겁먹었었는데, 퀴지즈로 혼자 제 화면 안에서 긴장 없이 풀어 내려갈 수 있었습니다! 힌트 덕분에 결국 다 풀었습니다!"
                        value={studentResponse}
                        onChange={(e) => setStudentResponse(e.target.value)}
                        className="w-full p-3 bg-white border-2 border-emerald-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none font-bold text-slate-800"
                      />
                    </div>
                  </div>
                </div>
              )}

              {step === 5 && (
                <div className="space-y-5">
                  <div>
                    <h3 className="text-base font-black text-vibrant-dark mb-1">에듀테크 AI 전문의 닥터 감수</h3>
                    <p className="text-xs text-slate-500 font-bold">임상 시뮬레이션을 실행하여 처방의 적합도 등급(S, A, B), 치료 기전, 부작용 경고 및 시너지 팁을 발급받습니다.</p>
                  </div>

                  {!aiFeedback && !aiLoading && (
                    <div className="text-center py-10 bg-slate-50 border-2 border-dashed border-slate-300 rounded-3xl space-y-4">
                      <div className="h-14 w-14 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto">
                        <Sparkles className="h-7 w-7" />
                      </div>
                      <div>
                        <h4 className="font-extrabold text-slate-800 text-sm">아직 AI 전문의 감수서가 발행되지 않았습니다</h4>
                        <p className="text-xs text-slate-500 mt-1">버튼을 클릭하면 처방전의 안전성과 수업 성분 궁합을 정밀 분석합니다.</p>
                      </div>
                      <button
                        onClick={handleRequestAi}
                        className="bg-vibrant-red hover:bg-red-500 text-white font-black text-xs px-6 py-3 rounded-xl shadow-md cursor-pointer transition-all"
                      >
                        AI 전문의 감수 소견서 발급받기 🩺
                      </button>
                    </div>
                  )}

                  {aiLoading && (
                    <div className="py-12 bg-amber-50/50 border-2 border-amber-300 rounded-3xl text-center space-y-4">
                      <div className="h-10 w-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                      <h4 className="font-extrabold text-amber-900 text-sm">{loadingStages[loadingStage]}</h4>
                      <p className="text-xs text-amber-700">인공지능 교육공학 전문의가 임상 데이터베이스와 대조 검증 중입니다...</p>
                    </div>
                  )}

                  {aiFeedback && !aiLoading && (
                    <div className="space-y-4 animate-in fade-in">
                      <div className="bg-white border-4 border-amber-400 rounded-3xl p-6 relative overflow-hidden shadow-sm">
                        <div className="flex items-center justify-between mb-4 pb-3 border-b border-amber-200">
                          <div className="flex items-center gap-3">
                            <span className="h-10 w-10 rounded-2xl bg-amber-400 text-vibrant-dark flex items-center justify-center font-black text-xl">
                              {aiFeedback.rating}
                            </span>
                            <div>
                              <span className="text-[10px] text-amber-700 font-mono font-black tracking-widest block uppercase">
                                VERIFIED TIER {aiFeedback.rating}
                              </span>
                              <h4 className="font-black text-base text-slate-900">AI 감수 결과 보고서</h4>
                            </div>
                          </div>
                          <button
                            onClick={handleRequestAi}
                            className="text-[11px] font-bold text-slate-500 hover:text-slate-800 underline cursor-pointer"
                          >
                            재감수 실행
                          </button>
                        </div>

                        <div className="space-y-3 text-xs leading-relaxed">
                          <div>
                            <strong className="text-amber-950 font-black block mb-1">■ 종합 소견 (Evaluation)</strong>
                            <p className="bg-amber-50 p-3 rounded-xl border border-amber-200 font-bold text-slate-800">
                              {aiFeedback.reviewText}
                            </p>
                          </div>
                          <div>
                            <strong className="text-slate-900 font-black block mb-1">■ 수업 치유 기전 (Mechanism)</strong>
                            <p className="text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-200 font-medium">
                              {aiFeedback.mechanism}
                            </p>
                          </div>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div className="bg-red-50 p-3 rounded-xl border border-red-200">
                              <strong className="text-red-900 font-black block mb-1">⚠️ 주의해야 할 부작용</strong>
                              <p className="text-red-800 text-[11px] font-medium leading-relaxed">{aiFeedback.sideEffects}</p>
                            </div>
                            <div className="bg-teal-50 p-3 rounded-xl border border-teal-200">
                              <strong className="text-teal-900 font-black block mb-1">💡 처방 시너지 팁</strong>
                              <p className="text-teal-800 text-[11px] font-medium leading-relaxed">{aiFeedback.synergyTip}</p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Modal Footer Controls */}
            <div className="bg-slate-50 p-4 px-6 border-t-2 border-slate-200 flex justify-between items-center">
              <div>
                {step > 1 && (
                  <button
                    onClick={() => setStep(step - 1)}
                    className="px-4 py-2 border-2 border-slate-300 hover:bg-slate-200 rounded-xl text-xs font-black text-slate-700 transition-colors cursor-pointer"
                  >
                    ← 이전 단계
                  </button>
                )}
              </div>
              <div className="flex items-center gap-2">
                {step < 5 ? (
                  <button
                    onClick={() => setStep(step + 1)}
                    className="px-5 py-2.5 bg-slate-900 hover:bg-black text-white rounded-xl text-xs font-black transition-colors cursor-pointer"
                  >
                    다음 단계 →
                  </button>
                ) : (
                  <button
                    onClick={handleSave}
                    className="px-6 py-2.5 bg-vibrant-red hover:bg-red-500 text-white rounded-xl text-xs font-black shadow-md cursor-pointer transition-colors"
                  >
                    처방전 저장 및 차트 반영 완료 ✓
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      const [groups, setGroups] = useState(() => {
        const saved = localStorage.getItem("good_lesson_first_aid_single");
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          } catch (e) {
            console.error(e);
          }
        }
        return INITIAL_GROUPS;
      });

      const [activeTab, setActiveTab] = useState("dashboard");
      const [activeGroupForForm, setActiveGroupForForm] = useState(null);
      const [timeRemaining, setTimeRemaining] = useState(600);
      const [timerRunning, setTimerRunning] = useState(false);

      useEffect(() => {
        localStorage.setItem("good_lesson_first_aid_single", JSON.stringify(groups));
      }, [groups]);

      const handleSaveGroup = (updatedGroup) => {
        setGroups(groups.map((g) => (g.id === updatedGroup.id ? updatedGroup : g)));
        setActiveGroupForForm(null);
      };

      const handleAddCustomGroup = () => {
        const newIdx = groups.length + 1;
        const newGroup = {
          id: `group-${Date.now()}`,
          name: `학생 ${newIdx} (신규)`,
          problemTitle: "",
          problemDesc: "",
          cause: "",
          tools: [],
          element: GOOD_LESSON_ELEMENTS[0],
          extraNotes: "",
          reactions: { good: 0, perfect: 0, creative: 0, cure: 0 },
          comments: [],
          aiPrescription: null,
          status: "diagnosing",
          updatedAt: new Date().toLocaleTimeString(),
          studentResponse: "",
        };
        setGroups([...groups, newGroup]);
        setActiveGroupForForm(newGroup);
      };

      const handleDeleteGroup = (groupId) => {
        if (confirm("정말로 이 학생의 개별 진료 차트를 영구 폐기하시겠습니까?")) {
          setGroups(groups.filter((g) => g.id !== groupId));
        }
      };

      const handleResetSession = () => {
        if (confirm("전체 학생 개별 처방 및 답변 기록을 초기 상태로 복원하시겠습니까?")) {
          setGroups(INITIAL_GROUPS);
          setTimeRemaining(600);
          setTimerRunning(false);
          localStorage.removeItem("good_lesson_first_aid_single");
        }
      };

      const handleAddReaction = (groupId, reactionType) => {
        setGroups(
          groups.map((g) => {
            if (g.id === groupId) {
              const updatedReactions = { ...g.reactions };
              updatedReactions[reactionType] = (updatedReactions[reactionType] || 0) + 1;
              return { ...g, reactions: updatedReactions };
            }
            return g;
          })
        );
      };

      const handleAddComment = (groupId, author, text) => {
        const newComment = {
          id: `comment-${Date.now()}`,
          author,
          text,
          createdAt: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        };
        setGroups(
          groups.map((g) => {
            if (g.id === groupId) {
              return { ...g, comments: [...g.comments, newComment] };
            }
            return g;
          })
        );
      };

      const handleDeleteComment = (groupId, commentId) => {
        setGroups(
          groups.map((g) => {
            if (g.id === groupId) {
              return { ...g, comments: g.comments.filter((c) => c.id !== commentId) };
            }
            return g;
          })
        );
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans">
          <Header
            timeRemaining={timeRemaining}
            setTimeRemaining={setTimeRemaining}
            timerRunning={timerRunning}
            setTimerRunning={setTimerRunning}
            onAddGroup={handleAddCustomGroup}
            onResetSession={handleResetSession}
            groupCount={groups.length}
          />

          <main className="max-w-7xl w-full mx-auto p-4 md:p-8 flex-1 flex flex-col gap-6">
            {/* Navigation Tabs */}
            <div className="flex border-b border-slate-200 gap-2 overflow-x-auto select-none bg-white p-2 rounded-2xl shadow-sm">
              <button
                onClick={() => setActiveTab("dashboard")}
                className={`flex items-center gap-2 py-2.5 px-4 rounded-xl text-xs font-bold transition-all whitespace-nowrap cursor-pointer ${
                  activeTab === "dashboard" ? "bg-slate-900 text-white shadow-md" : "text-slate-500 hover:text-slate-800 hover:bg-slate-100"
                }`}
              >
                <LayoutDashboard className="h-4 w-4" />
                개인별 응급 진료실 (학생 3인 상태 체험)
              </button>

              <button
                onClick={() => setActiveTab("present")}
                className={`flex items-center gap-2 py-2.5 px-4 rounded-xl text-xs font-bold transition-all whitespace-nowrap cursor-pointer ${
                  activeTab === "present" ? "bg-slate-900 text-white shadow-md" : "text-slate-500 hover:text-slate-800 hover:bg-slate-100"
                }`}
              >
                <Megaphone className="h-4 w-4" />
                개인별 처방 발표장 (답변 확인 보드)
              </button>

              <button
                onClick={() => setActiveTab("cabinet")}
                className={`flex items-center gap-2 py-2.5 px-4 rounded-xl text-xs font-bold transition-all whitespace-nowrap cursor-pointer ${
                  activeTab === "cabinet" ? "bg-slate-900 text-white shadow-md" : "text-slate-500 hover:text-slate-800 hover:bg-slate-100"
                }`}
              >
                <BookOpen className="h-4 w-4" />
                에듀테크 상비약 사전
              </button>

              <button
                onClick={() => setActiveTab("print")}
                className={`ml-auto flex items-center gap-2 py-2.5 px-4 rounded-xl text-xs font-bold transition-all whitespace-nowrap cursor-pointer ${
                  activeTab === "print" ? "bg-slate-900 text-white shadow-md" : "text-slate-500 hover:text-slate-800 hover:bg-slate-100"
                }`}
              >
                <Printer className="h-4 w-4" />
                처방전 일괄 인쇄/임상 저장
              </button>
            </div>

            {/* Info Guide Card */}
            <div className="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-100 rounded-2xl p-4 flex gap-3 text-xs text-emerald-800">
              <Activity className="h-5 w-5 text-emerald-600 shrink-0 mt-0.5" />
              <div className="space-y-1">
                <h3 className="font-extrabold text-emerald-950 flex items-center gap-1">
                  <Sparkles className="h-4 w-4 text-emerald-600" />
                  '좋은 수업 응급처치(Good Teaching First-Aid)' 워크숍 가이드라인
                </h3>
                <p className="leading-relaxed">
                  체험하고 싶은 학생의 개별 교실 병증 상황을 선택하여 진찰과 처방을 시작하세요!
                  <strong> 1단계:</strong> 개별 상황 유발 인자 진단 →
                  <strong> 2단계:</strong> 에듀테크 상비약 배합 →
                  <strong> 3단계:</strong> 좋은 수업 기전 매칭 및 학생 답변 구상 →
                  <strong> 4단계:</strong> 에듀테크 AI 전문의 닥터에게 정밀 조제 감수 소견을 발급받으면,
                  <strong>실제 학생들이 에듀테크를 통해 각각 어떻게 대답하고 반응했는지</strong> 결과를 실시간으로 생생하게 목격할 수 있습니다!
                </p>
              </div>
            </div>

            {/* View 1: Dashboard View */}
            {activeTab === "dashboard" && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-lg font-extrabold text-slate-800 flex items-center gap-2">
                    <Stethoscope className="h-5 w-5 text-rose-500" />
                    실시간 개별 응급 진찰실 ({groups.length}명의 학생 차트 대기 중)
                  </h2>
                  <p className="text-xs text-slate-500">각 학생의 [개인 차트 처방]을 눌러 상황에 맞는 개별화 해결책을 도출하세요.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {groups.map((group) => (
                    <div
                      key={group.id}
                      className="bg-white rounded-3xl border border-slate-200 p-6 flex flex-col justify-between shadow-sm hover:shadow-md transition-shadow relative overflow-hidden"
                    >
                      <div className="absolute top-4 right-4">
                        {group.status === "complete" ? (
                          <span className="bg-emerald-50 border border-emerald-200 text-emerald-700 font-extrabold text-[9px] px-2 py-0.5 rounded-full">
                            ● AI 처방 감수 필
                          </span>
                        ) : group.status === "prescribed" ? (
                          <span className="bg-amber-50 border border-amber-200 text-amber-700 font-extrabold text-[9px] px-2 py-0.5 rounded-full">
                            ● 약 조제 완료
                          </span>
                        ) : (
                          <span className="bg-slate-100 border border-slate-200 text-slate-500 font-extrabold text-[9px] px-2 py-0.5 rounded-full">
                            ○ 기초 원인 분석 중
                          </span>
                        )}
                      </div>

                      <div className="space-y-4">
                        <span className="text-rose-500 font-mono text-[11px] font-extrabold tracking-wider bg-rose-50 px-2 py-1 rounded-lg border border-rose-100">
                          💉 {group.name} CHART
                        </span>

                        <div className="space-y-1">
                          <h3 className="text-xs font-extrabold text-slate-800 leading-snug line-clamp-2">
                            {group.problemTitle || "지정된 교실 응급 상황이 없습니다."}
                          </h3>
                          <p className="text-[11px] text-slate-500 line-clamp-3">
                            {group.problemDesc || "오른쪽 하단 처방전 작성하기 버튼을 눌러 학생의 문제 상황 및 해독제 조제를 가동해 주십시오."}
                          </p>
                        </div>

                        <div className="grid grid-cols-3 gap-1 pt-3 border-t border-slate-100 text-center">
                          <div className="p-1 px-1.5 rounded bg-slate-100/50">
                            <span className="text-[9px] text-slate-400 block font-bold">1단계 원인</span>
                            <span className={`text-[10px] font-bold ${group.cause ? "text-slate-800" : "text-slate-300"}`}>
                              {group.cause ? "진단 필" : "미작성"}
                            </span>
                          </div>
                          <div className="p-1 px-1.5 rounded bg-slate-100/50">
                            <span className="text-[9px] text-slate-400 block font-bold">2단계 상비약</span>
                            <span className={`text-[10px] font-bold ${group.tools.length > 0 ? "text-rose-600" : "text-slate-300"}`}>
                              {group.tools.length > 0 ? `${group.tools.length}종 처방` : "미배합"}
                            </span>
                          </div>
                          <div className="p-1 px-1.5 rounded bg-slate-100/50">
                            <span className="text-[9px] text-slate-400 block font-bold">3단계 AI감수</span>
                            <span className={`text-[10px] font-bold ${group.aiPrescription ? "text-amber-600" : "text-slate-300"}`}>
                              {group.aiPrescription ? `등급 ${group.aiPrescription.rating}` : "미감수"}
                            </span>
                          </div>
                        </div>
                      </div>

                      <div className="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                        <span className="text-[10px] text-slate-400 font-mono">
                          수정: {group.updatedAt || "방금 전"}
                        </span>
                        <button
                          onClick={() => setActiveGroupForForm(group)}
                          className="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs px-3 py-2 rounded-xl border border-slate-900 transition-colors cursor-pointer"
                        >
                          처방전 작성/감수하기 →
                        </button>
                      </div>
                    </div>
                  ))}

                  <div
                    onClick={handleAddCustomGroup}
                    className="border-2 border-dashed border-slate-300 rounded-3xl p-6 bg-slate-100/30 hover:bg-slate-100/50 hover:border-slate-400 cursor-pointer flex flex-col items-center justify-center text-center space-y-2 transition-all min-h-[220px]"
                  >
                    <div className="h-10 w-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 font-black">
                      +
                    </div>
                    <div>
                      <h3 className="text-xs font-bold text-slate-700">추가 개별 처방 차트 생성</h3>
                      <p className="text-[11px] text-slate-400 mt-0.5">새로운 개별 학생 대응 차트를 배정합니다.</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* View 2: Presentation Board View */}
            {activeTab === "present" && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-lg font-extrabold text-slate-800 flex items-center gap-2">
                    <Megaphone className="h-5 w-5 text-rose-500" />
                    학생 개별 처방 및 답변 발표판
                  </h2>
                  <p className="text-xs text-slate-500">
                    각 학생의 개인 차트 처방을 둘러보고, 실제 에듀테크 적용 시 학생들이 각각 어떻게 대답하고 반응했는지 실시간 데이터 결과를 확인하며 동료 피드백을 나눠보세요.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {groups.map((group) => (
                    <PrescriptionCard
                      key={group.id}
                      group={group}
                      onEdit={() => setActiveGroupForForm(group)}
                      onDelete={() => handleDeleteGroup(group.id)}
                      onReact={handleAddReaction}
                      onAddComment={handleAddComment}
                      onDeleteComment={handleDeleteComment}
                    />
                  ))}
                </div>
              </div>
            )}

            {/* View 3: Cabinet View */}
            {activeTab === "cabinet" && (
              <Cabinet />
            )}

            {/* View 4: Print/Report View */}
            {activeTab === "print" && (
              <div className="space-y-6 bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                <div className="flex items-center justify-between border-b border-slate-200 pb-4">
                  <div>
                    <h2 className="text-lg font-extrabold text-slate-800">
                      좋은 수업 응급 처방 보고서 RX 종합 대장
                    </h2>
                    <p className="text-xs text-slate-400 mt-1">오늘 워크숍 및 발표에서 도출된 에듀테크 해결 대장 전체 조제 목록입니다.</p>
                  </div>
                  <button
                    onClick={() => window.print()}
                    className="bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs p-2.5 px-4 rounded-xl flex items-center gap-1.5 cursor-pointer shadow-sm"
                  >
                    <Printer className="h-4 w-4" />
                    PDF 리포트 인쇄 출력하기
                  </button>
                </div>

                <div className="space-y-8 divide-y divide-slate-100">
                  {groups.map((group, idx) => (
                    <div key={group.id} className={`pt-6 ${idx === 0 ? "pt-0" : ""}`}>
                      <div className="flex items-start justify-between">
                        <h3 className="font-extrabold text-sm text-slate-900 bg-slate-100 px-3 py-1 rounded border border-slate-200 uppercase">
                          🩺 {group.name} 처방 기록 일지
                        </h3>
                        <span className="text-xs text-slate-400 font-mono">조제 일시: {group.updatedAt || "방금 전"}</span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4 text-xs text-slate-700">
                        <div className="space-y-3">
                          <div>
                            <strong className="text-slate-800 block mb-1">■ 응급 진단 상황</strong>
                            <p className="text-slate-600 pl-2 border-l-2 border-rose-200 leading-relaxed font-normal">
                              {group.problemTitle || "내용 없음"}
                            </p>
                          </div>

                          <div>
                            <strong className="text-slate-800 block mb-1">■ 근본 원인 분석</strong>
                            <p className="text-slate-600 leading-relaxed font-normal bg-slate-50 p-2.5 rounded-lg whitespace-pre-wrap">
                              {group.cause || "진단 분석 미진"}
                            </p>
                          </div>

                          {group.studentResponse && (
                            <div>
                              <strong className="text-emerald-900 block mb-1 font-bold">■ 💊 에듀테크 적용 시 실제 학생 제출 답변</strong>
                              <p className="text-emerald-950 font-bold bg-emerald-50/70 p-3 rounded-xl border border-emerald-300 leading-relaxed">
                                💬 "{group.studentResponse}"
                              </p>
                            </div>
                          )}
                        </div>

                        <div className="space-y-3">
                          <div>
                            <strong className="text-slate-800 block mb-1">■ 처방 에듀테크 목록</strong>
                            <div className="flex flex-wrap gap-1">
                              {group.tools.length > 0 ? (
                                group.tools.map((t) => (
                                  <span key={t} className="bg-rose-50 text-rose-700 font-bold px-2 py-0.5 rounded border border-rose-200 text-[10px] uppercase">
                                    {t}
                                  </span>
                                ))
                              ) : (
                                <span className="text-slate-400">배합 없음</span>
                              )}
                            </div>
                          </div>

                          <div>
                            <strong className="text-slate-800 block mb-1">■ 좋은 수업 가치 연결 기전</strong>
                            <p className="text-slate-600 leading-relaxed font-normal">
                              🧬 {group.element}
                              {group.extraNotes && <span className="block mt-1 text-[11px] text-slate-500 italic"> - {group.extraNotes}</span>}
                            </p>
                          </div>

                          {group.aiPrescription && (
                            <div className="bg-rose-50/50 p-3 rounded-xl border border-rose-100">
                              <strong className="text-rose-900 block font-bold text-[11px] mb-1">
                                🤖 AI 전문의 진찰 판정: [ TIER {group.aiPrescription.rating} ]
                              </strong>
                              <p className="text-rose-950 text-[11px] leading-relaxed font-normal">
                                {group.aiPrescription.reviewText}
                              </p>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Prescription Maker Modal */}
          {activeGroupForForm && (
            <PrescriptionMaker
              group={activeGroupForForm}
              onSave={handleSaveGroup}
              onClose={() => setActiveGroupForForm(null)}
            />
          )}

          {/* Footer */}
          <footer className="mt-auto py-8 text-center border-t border-slate-200/60 bg-white">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between text-[11px] text-slate-400 gap-4">
              <p>© 2026 좋은 수업 응급처치 Rx. 교실 혁신 에듀테크 워크숍 보드.</p>
              <div className="flex gap-4">
                <span>Self-contained Single HTML Application</span>
                <span>Local Web Storage Session</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
