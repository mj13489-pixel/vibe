<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDC 한국십진분류법 짝맞추기 📚</title>
    <!-- Tailwind CSS for layout and utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cute, rounded font suitable for kids -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f1f8e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            user-select: none; /* Prevent text selection during fast clicking */
        }

        /* 3D Card Flip CSS */
        .card-container {
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-back {
            background: #a5d6a7;
            border: 4px solid #81c784;
            color: white;
            font-size: 2.5rem;
            /* Add a cute pattern to the back */
            background-image: radial-gradient(#fff 15%, transparent 16%), radial-gradient(#fff 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .card-back::after {
            content: '?';
            background: rgba(129, 199, 132, 0.9);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .card-front {
            background: #ffffff;
            border: 4px solid #8d6e63;
            transform: rotateY(180deg);
            font-size: 1.5rem; /* Adjusted for KDC text */
            font-weight: 900;
            color: #3e2723;
            text-align: center;
            word-break: keep-all;
            padding: 0.5rem;
        }

        .matched .card-front {
            background: #d4edda;
            border-color: #28a745;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }

        /* UI Animations */
        .btn-hover {
            transition: all 0.2s ease;
        }
        .btn-hover:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .btn-hover:active {
            transform: translateY(1px) scale(0.95);
        }

        /* Confetti Canvas overlay */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center py-6 px-4">

    <!-- Confetti Overlay -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Start / Audio Init Overlay (Browsers require interaction to play audio) -->
    <div id="start-screen" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
        <h1 class="text-5xl md:text-6xl font-black text-green-700 mb-6 drop-shadow-md text-center">KDC 분류법<br>짝맞추기 📚</h1>
        <p class="text-xl text-gray-700 mb-8 font-bold">도서관 분류 기호와 주제를 올바르게 연결해 보세요!</p>
        <button id="start-btn" class="bg-gradient-to-r from-green-500 to-teal-600 text-white text-2xl font-bold py-4 px-10 rounded-full btn-hover shadow-lg border-4 border-white">
            게임 시작! 🎮
        </button>
    </div>

    <!-- Main Game Container -->
    <div class="w-full max-w-2xl mx-auto bg-white/40 backdrop-blur-md p-6 rounded-3xl shadow-xl border-4 border-white/50 relative z-10 hidden" id="game-container">
        
        <!-- Header: Score & Controls -->
        <header class="flex justify-between items-center mb-6">
            <div class="bg-white px-4 py-2 rounded-2xl shadow-sm border-2 border-green-200 flex-shrink-0">
                <p class="text-sm text-green-600 font-bold uppercase tracking-wider text-center">점수</p>
                <p class="text-3xl text-green-800 font-black leading-none text-center" id="score-display">0</p>
            </div>
            
            <h1 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-600 to-teal-700 text-center flex-1 mx-2 leading-tight">
                KDC 분류법<br>짝맞추기 📚
            </h1>

            <button id="restart-btn" title="다시 시작" class="bg-yellow-400 text-yellow-900 px-4 py-3 rounded-2xl shadow-sm border-2 border-yellow-300 font-bold btn-hover flex flex-col items-center justify-center flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
        </header>

        <!-- Game Board Grid -->
        <div id="game-board" class="grid grid-cols-4 sm:grid-cols-5 gap-2 sm:gap-3">
            <!-- Cards will be injected here via JavaScript -->
        </div>

    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden flex items-center justify-center">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center border-4 border-green-400 transform scale-90 transition-transform duration-300" id="win-modal-content">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-4xl font-black text-green-600 mb-2">훌륭합니다!</h2>
            <p class="text-lg text-gray-700 font-bold mb-6">모든 분류 기호를 정확히 맞췄어요!<br>최종 점수: <span id="final-score" class="text-teal-700 text-xl"></span>점</p>
            <button id="play-again-btn" class="w-full bg-gradient-to-r from-green-400 to-teal-500 text-white text-xl font-bold py-3 px-6 rounded-full btn-hover shadow-md">
                다시 시작 🔄
            </button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           Sound System (Web Audio API Synthesizer)
           ========================================================================== */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Ensure audio context is resumed on first interaction
        function initAudio() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Basic tone generator for sound effects
        function playTone(freq, type, duration, vol = 0.1) {
            if (audioCtx.state !== 'running') return;
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            // Envelope to prevent popping
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            flip: () => playTone(600, 'sine', 0.1, 0.05), // High, short pop
            match: () => {
                // Happy little chime (C5 then E5)
                playTone(523.25, 'sine', 0.1, 0.1);
                setTimeout(() => playTone(659.25, 'sine', 0.3, 0.1), 100);
            },
            wrong: () => {
                // Low disappointed boop
                playTone(200, 'triangle', 0.2, 0.1);
                setTimeout(() => playTone(150, 'triangle', 0.3, 0.15), 150);
            },
            win: () => {
                // Triumphant arpeggio
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25]; // C4, E4, G4, C5, E5
                notes.forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 'square', 0.2, 0.08), i * 150);
                });
                setTimeout(() => playTone(523.25, 'square', 0.6, 0.1), notes.length * 150);
            }
        };

        /* ==========================================================================
           Game State & Logic
           ========================================================================== */
        const kdcData = [
            { num: '000', name: '총류' },
            { num: '100', name: '철학' },
            { num: '200', name: '종교' },
            { num: '300', name: '사회과학' },
            { num: '400', name: '자연과학' },
            { num: '500', name: '기술과학' },
            { num: '600', name: '예술' },
            { num: '700', name: '언어' },
            { num: '800', name: '문학' },
            { num: '900', name: '역사' }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let score = 0;
        let isLocked = false; // Prevents clicking during animations

        const boardEl = document.getElementById('game-board');
        const scoreEl = document.getElementById('score-display');
        const winModal = document.getElementById('win-modal');
        const winModalContent = document.getElementById('win-modal-content');
        const finalScoreEl = document.getElementById('final-score');

        function initGame() {
            // Reset state
            boardEl.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            score = 0;
            isLocked = false;
            updateScore();
            winModal.classList.add('hidden');
            winModalContent.classList.remove('scale-100');
            winModalContent.classList.add('scale-90');
            stopConfetti();

            // Create pairs and shuffle
            let rawCards = [];
            kdcData.forEach((pair, index) => {
                rawCards.push({ display: pair.num, pairId: index, isMatched: false });
                rawCards.push({ display: pair.name, pairId: index, isMatched: false });
            });

            cards = rawCards.sort(() => Math.random() - 0.5);

            // Render cards
            cards.forEach((card, index) => {
                card.id = index;
                const cardEl = document.createElement('div');
                // aspect-square keeps the grid perfectly proportioned
                cardEl.className = 'card-container aspect-square';
                cardEl.dataset.id = card.id;
                
                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">${card.display}</div>
                    </div>
                `;
                
                cardEl.addEventListener('click', () => handleCardClick(cardEl, card));
                boardEl.appendChild(cardEl);
            });
        }

        function handleCardClick(cardEl, cardData) {
            // Guard clauses
            if (isLocked) return;
            if (cardData.isMatched) return;
            if (cardEl.classList.contains('flipped')) return;

            // Flip card visually and track it
            cardEl.classList.add('flipped');
            flippedCards.push({ element: cardEl, data: cardData });
            sounds.flip();

            // Check if two cards are flipped
            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            isLocked = true; // Lock board while checking/animating
            
            const [card1, card2] = flippedCards;
            const isMatch = card1.data.pairId === card2.data.pairId;

            if (isMatch) {
                // Match Success
                setTimeout(() => {
                    sounds.match();
                    card1.element.classList.add('matched');
                    card2.element.classList.add('matched');
                    card1.data.isMatched = true;
                    card2.data.isMatched = true;
                    
                    score += 10;
                    matchedPairs++;
                    updateScore();
                    resetTurn();

                    // Check win condition
                    if (matchedPairs === kdcData.length) {
                        handleWin();
                    }
                }, 400); // Wait for flip animation to nearly finish
            } else {
                // Match Failed
                setTimeout(() => {
                    sounds.wrong();
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    score = Math.max(0, score - 2); // Penalty, but don't go below 0
                    updateScore();
                    resetTurn();
                }, 1000); // 1-second delay before flipping back
            }
        }

        function resetTurn() {
            flippedCards = [];
            isLocked = false;
        }

        function updateScore() {
            scoreEl.textContent = score;
            // Pop effect on score change
            scoreEl.style.transform = 'scale(1.3)';
            setTimeout(() => scoreEl.style.transform = 'scale(1)', 200);
            scoreEl.style.transition = 'transform 0.2s';
        }

        function handleWin() {
            setTimeout(() => {
                sounds.win();
                startConfetti();
                finalScoreEl.textContent = score;
                winModal.classList.remove('hidden');
                // Small delay for animation trigger
                setTimeout(() => {
                    winModalContent.classList.remove('scale-90');
                    winModalContent.classList.add('scale-100');
                }, 10);
            }, 500);
        }

        /* ==========================================================================
           Confetti Particle System (Canvas)
           ========================================================================== */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId;
        const colors = ['#f472b6', '#a78bfa', '#60a5fa', '#34d399', '#fbbf24']; // Tailwind colors

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.w = Math.random() * 10 + 5;
                this.h = Math.random() * 10 + 5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.vy = Math.random() * 3 + 2;
                this.vx = Math.random() * 2 - 1;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 5 - 2.5;
            }
            update() {
                this.y += this.vy;
                this.x += this.vx;
                this.angle += this.spin;
                // Reset to top if it falls off screen
                if (this.y > canvas.height) {
                    this.y = -10;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                ctx.restore();
            }
        }

        function startConfetti() {
            confettiParticles = Array.from({ length: 150 }, () => new Particle());
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                confettiParticles.forEach(p => {
                    p.update();
                    p.draw();
                });
                confettiAnimationId = requestAnimationFrame(animate);
            }
            animate();
        }

        function stopConfetti() {
            cancelAnimationFrame(confettiAnimationId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        /* ==========================================================================
           Event Listeners & Initialization
           ========================================================================== */
        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio(); // Required to unlock Web Audio API
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', initGame);
        document.getElementById('play-again-btn').addEventListener('click', initGame);

    </script>
</body>
</html>
