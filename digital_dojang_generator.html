<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>전자 도장 & 사인 생성기</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: 10종 이상의 다양한 무료 한글 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang&family=Hahmlet&family=Jua&family=Nanum+Brush+Script&family=Nanum+Pen+Script&family=Noto+Sans+KR&family=Noto+Serif+KR&family=Poor+Story&family=Song+Myung&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0fdf4; /* emerald-50 */
        }
        
        /* 투명 배경 체크무늬 패턴 */
        .bg-transparent-pattern {
            background-image: 
                linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
                linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
                linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: white;
        }

        * { -webkit-tap-highlight-color: transparent; }
        #drawSignCanvas { touch-action: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="bg-white rounded-2xl shadow-xl shadow-emerald-900/10 w-full max-w-5xl flex flex-col md:flex-row overflow-hidden border border-emerald-100">
        
        <!-- 왼쪽 패널: 컨트롤 -->
        <div class="w-full md:w-1/2 p-6 md:p-8 bg-emerald-50/50 flex flex-col gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-2xl md:text-3xl font-bold text-emerald-900 tracking-tight">도장 & 사인 생성기</h1>
                <p class="text-sm text-emerald-600 mt-2">다양한 폰트로 나만의 전자 결재 서명을 만드세요.</p>
            </div>

            <!-- 3단 탭 메뉴 -->
            <div class="flex p-1 bg-emerald-100/50 rounded-xl gap-1">
                <button id="tabStamp" class="flex-1 py-2.5 text-sm font-bold rounded-lg bg-white shadow-sm text-emerald-800 transition-all border border-emerald-200">도장 만들기</button>
                <button id="tabTextSign" class="flex-1 py-2.5 text-sm font-bold rounded-lg text-emerald-600 hover:bg-emerald-100 transition-all border border-transparent">텍스트 사인</button>
                <button id="tabDrawSign" class="flex-1 py-2.5 text-sm font-bold rounded-lg text-emerald-600 hover:bg-emerald-100 transition-all border border-transparent">직접 그리기</button>
            </div>

            <hr class="border-emerald-100">

            <!-- 1. 도장 만들기 패널 -->
            <div id="stampControls" class="flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-emerald-800">이름 (최대 3글자, '인' 자동추가)</label>
                    <input type="text" id="stampNameInput" maxlength="3" placeholder="홍길동" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-shadow">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-emerald-800">글씨체 (무료 폰트 10종)</label>
                    <select id="stampFontSelect" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <option value="Noto Serif KR">본명조 (단정함)</option>
                        <option value="Noto Sans KR">본고딕 (깔끔함)</option>
                        <option value="Hahmlet">함초롬체 (클래식)</option>
                        <option value="Gowun Batang">고운바탕 (부드러움)</option>
                        <option value="Song Myung">송명 (전통적)</option>
                        <option value="Nanum Pen Script">나눔 펜 스크립트 (펜글씨)</option>
                        <option value="Nanum Brush Script">나눔 브러시 스크립트 (붓글씨)</option>
                        <option value="Jua">주아 (귀여움)</option>
                        <option value="Poor Story">푸어 스토리 (손글씨)</option>
                        <option value="Black Han Sans">검은고딕 (두꺼움)</option>
                    </select>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-emerald-800">테두리 모양</label>
                    <div class="flex gap-3">
                        <label class="flex-1 cursor-pointer relative">
                            <input type="radio" name="stampShape" value="circle" checked class="peer sr-only">
                            <div class="px-4 py-3 text-center rounded-xl border-2 border-emerald-100 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 text-emerald-700 font-bold transition-all shadow-sm">원형</div>
                        </label>
                        <label class="flex-1 cursor-pointer relative">
                            <input type="radio" name="stampShape" value="square" class="peer sr-only">
                            <div class="px-4 py-3 text-center rounded-xl border-2 border-emerald-100 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 text-emerald-700 font-bold transition-all shadow-sm">사각형</div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 2. 텍스트 사인 패널 -->
            <div id="textSignControls" class="flex flex-col gap-6 hidden">
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-emerald-800">사인 텍스트</label>
                    <input type="text" id="textSignInput" placeholder="홍길동" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-emerald-800">글씨체</label>
                    <select id="textSignFontSelect" class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <option value="Nanum Pen Script">나눔 펜 스크립트</option>
                        <option value="Nanum Brush Script">나눔 브러시 스크립트</option>
                        <option value="Poor Story">푸어 스토리</option>
                        <option value="Jua">주아</option>
                        <option value="Gowun Batang">고운바탕</option>
                        <option value="Noto Serif KR">본명조</option>
                    </select>
                </div>
            </div>

            <!-- 3. 그리기 사인 패널 -->
            <div id="drawSignControls" class="flex flex-col gap-6 hidden">
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-emerald-800 flex justify-between">
                        <span>펜 굵기</span>
                        <span id="penWidthValue" class="text-emerald-600">3px</span>
                    </label>
                    <input type="range" id="penWidth" min="1" max="10" value="3" class="w-full accent-emerald-600 h-2 bg-emerald-200 rounded-lg appearance-none cursor-pointer">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-semibold text-emerald-800">펜 색상</label>
                    <div class="flex gap-3">
                        <label class="flex-1 cursor-pointer relative">
                            <input type="radio" name="penColor" value="#000000" checked class="peer sr-only">
                            <div class="px-4 py-3 text-center rounded-xl border-2 border-emerald-100 peer-checked:border-gray-800 peer-checked:bg-gray-100 text-gray-800 font-bold transition-all flex items-center justify-center gap-2"><div class="w-4 h-4 rounded-full bg-black"></div> 검정</div>
                        </label>
                        <label class="flex-1 cursor-pointer relative">
                            <input type="radio" name="penColor" value="#047857" class="peer sr-only">
                            <div class="px-4 py-3 text-center rounded-xl border-2 border-emerald-100 peer-checked:border-emerald-700 peer-checked:bg-emerald-100 text-emerald-800 font-bold transition-all flex items-center justify-center gap-2"><div class="w-4 h-4 rounded-full bg-emerald-700"></div> 녹색</div>
                        </label>
                        <label class="flex-1 cursor-pointer relative">
                            <input type="radio" name="penColor" value="#1E3A8A" class="peer sr-only">
                            <div class="px-4 py-3 text-center rounded-xl border-2 border-emerald-100 peer-checked:border-blue-800 peer-checked:bg-blue-100 text-blue-900 font-bold transition-all flex items-center justify-center gap-2"><div class="w-4 h-4 rounded-full bg-blue-900"></div> 남색</div>
                        </label>
                    </div>
                </div>

                <button id="clearSignBtn" class="mt-2 w-full py-3 bg-white border border-emerald-200 text-emerald-700 font-semibold rounded-xl hover:bg-emerald-50 transition-colors shadow-sm">
                    초기화
                </button>
            </div>
            
            <div class="hidden md:block flex-grow"></div>
        </div>

        <!-- 오른쪽 패널: 캔버스 및 다운로드 -->
        <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col items-center justify-between bg-white border-t md:border-t-0 md:border-l border-emerald-100">
            
            <div class="w-full flex flex-col items-center">
                <h2 class="text-xs font-bold text-emerald-500 mb-4 uppercase tracking-widest bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">미리보기</h2>
                
                <div class="bg-transparent-pattern rounded-2xl p-6 md:p-8 border border-gray-200 shadow-inner flex items-center justify-center w-full max-w-[320px] aspect-square relative group">
                    <!-- 도장 캔버스 -->
                    <canvas id="stampCanvas" width="300" height="300" class="w-full h-full object-contain drop-shadow-md"></canvas>
                    
                    <!-- 텍스트 사인 캔버스 -->
                    <canvas id="textSignCanvas" width="400" height="300" class="w-full h-full object-contain drop-shadow-md hidden"></canvas>
                    
                    <!-- 그리기 사인 캔버스 -->
                    <canvas id="drawSignCanvas" width="400" height="300" class="w-full h-full object-contain drop-shadow-md hidden cursor-crosshair border border-dashed border-gray-300 rounded"></canvas>
                </div>
                
                <p class="mt-4 text-xs text-gray-400 text-center">투명 배경 (PNG)으로 저장됩니다.</p>
            </div>

            <button id="downloadBtn" class="mt-8 w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-emerald-600/30 transition-all flex justify-center items-center gap-2 text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                <span id="downloadBtnText">도장 다운로드</span>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Canvases
            const stampCanvas = document.getElementById('stampCanvas');
            const stampCtx = stampCanvas.getContext('2d');
            
            const textSignCanvas = document.getElementById('textSignCanvas');
            const textSignCtx = textSignCanvas.getContext('2d');
            
            const drawSignCanvas = document.getElementById('drawSignCanvas');
            const drawSignCtx = drawSignCanvas.getContext('2d', { willReadFrequently: true });
            
            // Tabs
            const tabs = {
                stamp: document.getElementById('tabStamp'),
                textSign: document.getElementById('tabTextSign'),
                drawSign: document.getElementById('tabDrawSign')
            };
            const panels = {
                stamp: document.getElementById('stampControls'),
                textSign: document.getElementById('textSignControls'),
                drawSign: document.getElementById('drawSignControls')
            };
            const canvases = {
                stamp: stampCanvas,
                textSign: textSignCanvas,
                drawSign: drawSignCanvas
            };
            let currentTab = 'stamp';

            // Controls
            const stampNameInput = document.getElementById('stampNameInput');
            const stampFontSelect = document.getElementById('stampFontSelect');
            const stampShapeRadios = document.querySelectorAll('input[name="stampShape"]');
            
            const textSignInput = document.getElementById('textSignInput');
            const textSignFontSelect = document.getElementById('textSignFontSelect');
            
            const penWidthInput = document.getElementById('penWidth');
            const penWidthValue = document.getElementById('penWidthValue');
            const clearSignBtn = document.getElementById('clearSignBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const downloadBtnText = document.getElementById('downloadBtnText');

            const STAMP_COLOR = '#CC0000'; // 전통 도장 빨간색

            // --- 탭 전환 로직 ---
            function switchTab(tabId) {
                currentTab = tabId;
                
                // 탭 스타일 초기화
                Object.values(tabs).forEach(tab => {
                    tab.className = "flex-1 py-2.5 text-sm font-bold rounded-lg text-emerald-600 hover:bg-emerald-100 transition-all border border-transparent";
                });
                // 선택된 탭 스타일
                tabs[tabId].className = "flex-1 py-2.5 text-sm font-bold rounded-lg bg-white shadow-sm text-emerald-800 transition-all border border-emerald-200";

                // 패널 및 캔버스 표시 전환
                Object.keys(panels).forEach(key => {
                    if (key === tabId) {
                        panels[key].classList.remove('hidden');
                        canvases[key].classList.remove('hidden');
                    } else {
                        panels[key].classList.add('hidden');
                        canvases[key].classList.add('hidden');
                    }
                });

                // 버튼 텍스트 변경
                const btnTexts = {
                    stamp: '도장 다운로드',
                    textSign: '텍스트 사인 다운로드',
                    drawSign: '그린 사인 다운로드'
                };
                downloadBtnText.innerText = btnTexts[tabId];
                
                updateCanvases();
            }

            tabs.stamp.addEventListener('click', () => switchTab('stamp'));
            tabs.textSign.addEventListener('click', () => switchTab('textSign'));
            tabs.drawSign.addEventListener('click', () => switchTab('drawSign'));

            // --- 1. 도장 그리기 로직 ---
            function drawStamp() {
                stampCtx.clearRect(0, 0, stampCanvas.width, stampCanvas.height);

                let rawName = stampNameInput.value.trim() || '홍길동';
                let paddedName = rawName.padEnd(3, ' ');
                let stampText = paddedName.substring(0, 3) + '인';

                const fontName = stampFontSelect.value;
                const shape = document.querySelector('input[name="stampShape"]:checked').value;

                stampCtx.strokeStyle = STAMP_COLOR;
                stampCtx.lineWidth = 14;
                stampCtx.lineJoin = 'round';
                
                const padding = 16;
                const size = stampCanvas.width - (padding * 2);
                const centerX = stampCanvas.width / 2;
                const centerY = stampCanvas.height / 2;

                stampCtx.beginPath();
                if (shape === 'square') {
                    const r = 20, x = padding, y = padding;
                    stampCtx.moveTo(x + r, y);
                    stampCtx.lineTo(x + size - r, y);
                    stampCtx.quadraticCurveTo(x + size, y, x + size, y + r);
                    stampCtx.lineTo(x + size, y + size - r);
                    stampCtx.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
                    stampCtx.lineTo(x + r, y + size);
                    stampCtx.quadraticCurveTo(x, y + size, x, y + size - r);
                    stampCtx.lineTo(x, y + r);
                    stampCtx.quadraticCurveTo(x, y, x + r, y);
                } else {
                    stampCtx.arc(centerX, centerY, size / 2, 0, Math.PI * 2);
                }
                stampCtx.closePath();
                stampCtx.stroke();

                stampCtx.fillStyle = STAMP_COLOR;
                stampCtx.textAlign = 'center';
                stampCtx.textBaseline = 'middle';
                
                // 폰트별 대략적인 크기 보정
                let fontSize = 90;
                let yOffset = 5;
                if (fontName.includes('Script') || fontName.includes('Story')) {
                    fontSize = 110;
                    yOffset = -5;
                } else if (fontName === 'Black Han Sans') {
                    fontSize = 80;
                    yOffset = 8;
                }
                
                stampCtx.font = `bold ${fontSize}px '${fontName}', sans-serif`;
                const offset = size / 4 + 2; 

                stampCtx.fillText(stampText.charAt(0), centerX - offset, centerY - offset + yOffset);
                stampCtx.fillText(stampText.charAt(1), centerX + offset, centerY - offset + yOffset);
                stampCtx.fillText(stampText.charAt(2), centerX - offset, centerY + offset + yOffset);
                stampCtx.fillText(stampText.charAt(3), centerX + offset, centerY + offset + yOffset);
            }

            // --- 2. 텍스트 사인 그리기 로직 ---
            function drawTextSign() {
                textSignCtx.clearRect(0, 0, textSignCanvas.width, textSignCanvas.height);
                const text = textSignInput.value || '홍길동';
                const fontName = textSignFontSelect.value;
                
                textSignCtx.fillStyle = '#000000'; // 사인은 기본 검정
                textSignCtx.textAlign = 'center';
                textSignCtx.textBaseline = 'middle';
                textSignCtx.font = `80px '${fontName}', sans-serif`;
                
                textSignCtx.fillText(text, textSignCanvas.width / 2, textSignCanvas.height / 2);
            }

            // --- 3. 직접 그리기 사인 로직 ---
            let isDrawing = false;
            let lastX = 0, lastY = 0;

            function initDrawCanvas() {
                drawSignCtx.lineCap = 'round';
                drawSignCtx.lineJoin = 'round';
                drawSignCtx.clearRect(0, 0, drawSignCanvas.width, drawSignCanvas.height);
            }
            initDrawCanvas();

            function getCoords(e) {
                const rect = drawSignCanvas.getBoundingClientRect();
                const scaleX = drawSignCanvas.width / rect.width;
                const scaleY = drawSignCanvas.height / rect.height;
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function startDraw(e) {
                isDrawing = true;
                const coords = getCoords(e);
                lastX = coords.x; lastY = coords.y;
                
                drawSignCtx.lineWidth = parseInt(penWidthInput.value) * 2;
                drawSignCtx.strokeStyle = document.querySelector('input[name="penColor"]:checked').value;
                
                drawSignCtx.beginPath();
                drawSignCtx.moveTo(lastX, lastY);
                drawSignCtx.lineTo(lastX, lastY);
                drawSignCtx.stroke();
                e.preventDefault();
            }

            function draw(e) {
                if (!isDrawing) return;
                const coords = getCoords(e);
                drawSignCtx.beginPath();
                drawSignCtx.moveTo(lastX, lastY);
                drawSignCtx.lineTo(coords.x, coords.y);
                drawSignCtx.stroke();
                lastX = coords.x; lastY = coords.y;
                e.preventDefault();
            }

            function stopDraw() { isDrawing = false; }

            drawSignCanvas.addEventListener('mousedown', startDraw);
            drawSignCanvas.addEventListener('mousemove', draw);
            drawSignCanvas.addEventListener('mouseup', stopDraw);
            drawSignCanvas.addEventListener('mouseout', stopDraw);
            drawSignCanvas.addEventListener('touchstart', startDraw, { passive: false });
            drawSignCanvas.addEventListener('touchmove', draw, { passive: false });
            drawSignCanvas.addEventListener('touchend', stopDraw);

            penWidthInput.addEventListener('input', (e) => penWidthValue.textContent = e.target.value + 'px');
            clearSignBtn.addEventListener('click', initDrawCanvas);

            // --- 통합 업데이트 및 이벤트 연결 ---
            function updateCanvases() {
                if (currentTab === 'stamp') drawStamp();
                if (currentTab === 'textSign') drawTextSign();
            }

            stampNameInput.addEventListener('input', drawStamp);
            stampFontSelect.addEventListener('change', drawStamp);
            stampShapeRadios.forEach(r => r.addEventListener('change', drawStamp));
            
            textSignInput.addEventListener('input', drawTextSign);
            textSignFontSelect.addEventListener('change', drawTextSign);

            document.fonts.ready.then(updateCanvases);

            // --- 다운로드 로직 ---
            downloadBtn.addEventListener('click', () => {
                let canvas, fileName;
                if (currentTab === 'stamp') {
                    canvas = stampCanvas;
                    fileName = `${stampNameInput.value || '도장'}_전자도장.png`;
                } else if (currentTab === 'textSign') {
                    canvas = textSignCanvas;
                    fileName = `${textSignInput.value || '사인'}_텍스트사인.png`;
                } else {
                    canvas = drawSignCanvas;
                    fileName = `직접그린_사인.png`;
                }
                
                const link = document.createElement('a');
                link.download = fileName;
                link.href = canvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
            
            // 초기 렌더링 보장
            setTimeout(updateCanvases, 500);
        });
    </script>
</body>
</html>
